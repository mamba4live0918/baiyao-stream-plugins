function refreshGiftTestControls(){const select=$('test-rule'),send=$('panel-content').querySelector('[data-action="send-test-gift"]'),hint=$('test-gift-help');if(!select||!send)return;const enabled=doc.rules.filter(r=>r.enabled);if(!enabled.some(r=>r.id===testGiftId))testGiftId=enabled[0]?.id||'';select.innerHTML=(enabled.length?'':'<option value="" disabled selected>暂无已启用的礼物规则</option>')+doc.rules.map(r=>`<option value="${esc(r.id)}" ${r.id===testGiftId?'selected':''} ${r.enabled?'':'disabled'}>${esc(r.name)} · ${names[r.kind]}${r.enabled?'':'（未启用）'}</option>`).join('');select.value=testGiftId;select.disabled=!enabled.length;send.disabled=!doc.giftsEnabled||!enabled.length;hint.textContent=!doc.rules.length?'没有已保存的规则。点击「恢复默认灯牌排队」，或在上方添加并保存。':!enabled.length?'规则都未启用。请勾选上方「启用」并保存，或恢复默认灯牌排队。':!doc.giftsEnabled?'自动接收已关闭；先开启上方开关再发送模拟礼物。':'选择已启用、已保存的礼物测试；上方规则修改后需先保存。';}
function giftsPanel(){return `<div class="section"><h3>用户识别</h3><label>菘蓝没有用户 ID 时<select id="identity-mode"><option value="display" ${doc.identityMode==='display'?'selected':''}>按昵称＋头像自动排队</option><option value="strict" ${doc.identityMode==='strict'?'selected':''}>严格模式：留待人工确认</option></select></label><p class="hint">优先使用平台 ID。菘蓝当前未提供 ID 时，用昵称与头像建立本地记录；头像为空时按昵称识别。同名同头像无法区分，改名或换头像会视为新记录。该本地标识不是平台 ID。</p></div><div class="section"><div class="row between"><h3 style="margin:0">礼物触发规则</h3><label class="checkline"><input type="checkbox" id="gift-enabled" ${doc.giftsEnabled?'checked':''}>自动接收</label></div><p class="hint">礼物名按全角/半角、大小写归一后精确匹配；每条规则的数量门槛独立累计。默认 1 个粉丝团灯牌加入普通队列；普通排队不重复占位，再次锐评新增队尾机会。</p><div id="rules">${doc.rules.map(r=>`<div class="rule" data-rule="${esc(r.id)}"><div class="row"><input aria-label="礼物名称" data-rule-field="name" value="${esc(r.name)}" maxlength="100" placeholder="填写平台礼物名称"><label class="checkline"><input data-rule-field="enabled" type="checkbox" ${r.enabled?'checked':''}>启用</label>${button('delete-rule','×',r.id,'aria-label="删除规则"')}</div><div class="grid2"><label>作用<select data-rule-field="kind">${Object.entries(names).map(([k,n])=>`<option value="${k}" ${k===r.kind?'selected':''}>${n}</option>`).join('')}</select></label><label>每多少个礼物触发一次<input type="number" data-rule-field="min" min="1" max="9999" value="${r.min}"></label></div>${r.kind==='repeat'?`<label>每次触发增加的机会<input type="number" min="1" max="20" data-rule-field="opportunities" value="${r.opportunities}"></label>`:''}<div class="hint">${r.kind==='priority'?'先来先插队；正在评价不变。':r.kind==='repeat'?'同一人可获得多个机会，全部排到队尾。':'已经在队列的观众不会重复入列。'}</div></div>`).join('')||'<div class="blank">尚未配置礼物，默认不触发自动排队</div>'}</div><div class="toolbar">${button('add-rule','＋ 添加规则','',''+(doc.rules.length>=30?'disabled':''))}${button('save-rules','保存礼物规则','','class="primary"')}</div><p class="hint">修改后点击保存生效；调整规则会清零该规则未达门槛的累计数。</p></div><div class="section"><h3>菘蓝格式模拟礼物</h3><p id="test-gift-help" class="hint"></p><div class="toolbar">${button('add-default-rule','恢复默认灯牌排队','','class="small"')}</div><p class="hint">与安装版菘蓝模拟器一致：nickName、avatarUrl、giftName、count、giftIcon；不添加它没有的用户 ID 或事件 ID。</p><div class="stack"><label>礼物<select id="test-rule">${doc.rules.map(r=>`<option value="${esc(r.id)}">${esc(r.name)} · ${names[r.kind]}</option>`).join('')}</select></label><div class="grid2"><label>观众昵称<input id="test-nickname" value="测试小熊" maxlength="100"></label></div><label>礼物数量<input id="test-count" type="number" min="1" max="10000" value="1"></label>${button('send-test-gift','发送模拟礼物','','class="primary"')}</div><p class="hint">消息通过与真实礼物相同的适配和规则处理流程。</p></div>`;}
function profilesPanel(){return `<div class="section"><div class="row between"><h3 style="margin:0">用户资料库</h3><span class="muted">${doc.engine.profiles.length} / 500</span></div><p class="hint">保存昵称、头像和私人备注。收藏别名优先显示；平台 ID 用于区分同名观众。图片保存在当前浏览器，换电脑请导出备份。</p><div class="toolbar">${button('new-profile','＋ 保存用户')}${button('export','导出完整备份')}${button('import','导入备份')}</div>${doc.engine.profiles.map(p=>personRow(p,'profile')).join('')||'<div class="blank">收藏队列中的用户，或手动保存资料</div>'}</div>`;}
function appearancePanel(){const s=doc.settings,skin=s.skins[s.theme];return `<div class="section"><h3>上屏文字</h3><div class="stack"><label>主标题<input id="s-title" maxlength="40" value="${esc(s.title)}" placeholder="例如：锐评候场室"></label><label>评价状态文字<input id="s-reviewingLabel" maxlength="20" value="${esc(s.reviewingLabel)}" placeholder="例如：正在评价"></label></div><p class="hint">修改后移开输入框即可保存并更新画面，所有主题共用。状态文字最多 20 个字符。</p></div><div class="section"><h3>动画效果</h3><label>队列动态效果<select id="s-motion"><option value="system" ${s.motion==='system'?'selected':''}>跟随系统</option><option value="on" ${s.motion==='on'?'selected':''}>开启</option><option value="off" ${s.motion==='off'?'selected':''}>关闭</option></select></label><p class="hint">入队轻滑入、插队平滑换位、下一位短暂高亮。关闭后不播放队列动画；跟随系统时尊重减少动画设置。</p>${button('preview-motion','预览动画','','class="small"')}</div><div class="section"><h3>主题风格</h3><div class="theme-grid">${T.themes.map(t=>`<button class="theme-choice" role="radio" aria-checked="${s.theme===t.id}" data-theme="${t.id}" data-motif="${t.motif}" style="--sw-bg:${t.background};--sw-text:${t.text};--sw-border:${t.border};--sw-accent:${t.accent}">${t.name}<span class="theme-mark">${T.ornament(t.id+'-1')}</span><span class="radio"></span></button>`).join('')}</div></div><div class="section"><h3>自定义配色</h3><div class="colors-grid">${[['accent','主色'],['background','卡片底色'],['text','文字颜色'],['border','描边颜色']].map(([k,n])=>`<label>${n}<span class="color-field"><input type="color" data-color="${k}" value="${skin[k]}" aria-label="${n}"><input type="text" data-color-text="${k}" value="${skin[k]}" maxlength="7" aria-label="${n}色值"></span></label>`).join('')}</div><div class="row between" style="margin-top:22px"><h3 style="margin-bottom:12px">卡片不透明度</h3>${button('reset-colors','恢复主题配色','','class="small"')}</div><div class="opacity-line"><input id="opacity" type="range" min="0" max="100" value="${skin.opacity}" aria-label="卡片不透明度"><output id="opacity-value">${skin.opacity}%</output></div><p class="hint">只改变卡片底色，文字与头像保持清晰。配色按主题分别保存。</p></div>${decorationsPanel()}<div class="section"><h3>画面布局</h3><div class="stack"><p class="hint">直接拖动标题或卡片空白处移动整组；拖右下角箭头等比例放大或缩小。按钮和挂件编辑不会拖动整组。</p><div class="grid2"><label>队列整体大小（倍）<input id="s-scale" type="number" min="0.5" max="2.5" step="0.05" value="${s.scale}"></label><label>控制台字号 px<input id="s-menuFont" type="number" min="16" max="28" step="1" value="${s.menuFont}"></label></div><div class="grid2"><label>卡片排列<select id="s-layout"><option value="vertical" ${s.layout==='vertical'?'selected':''}>竖向</option><option value="horizontal" ${s.layout==='horizontal'?'selected':''}>横向</option></select></label><label>卡片宽度 px<input id="s-width" type="number" min="240" max="760" value="${s.width}"></label><label>间距 px<input id="s-gap" type="number" min="0" max="40" value="${s.gap}"></label><label>显示等待卡片数<input id="s-visible" type="number" min="1" max="20" value="${s.visible}"></label><label>左侧距离 %<input id="s-x" type="number" min="0" max="90" value="${s.x}"></label><label>顶部距离 %<input id="s-y" type="number" min="0" max="90" value="${s.y}"></label></div><label class="checkline"><input id="s-showEmpty" type="checkbox" ${s.showEmpty?'checked':''}>没有当前观众时显示等候提示</label><label class="checkline"><input id="s-showSource" type="checkbox" ${s.showSource?'checked':''}>卡片显示礼物来源</label>${button('reset-position','复位画面位置')}</div></div>`;}
function decorationsPanel(){const list=doc.settings.skins[doc.settings.theme].decorations[stickerTarget],st=list.find(a=>a.id===selectedSticker);return `<div class="section"><h3>卡片边缘装饰</h3><label>正在设置<select id="sticker-target"><option value="current" ${stickerTarget==='current'?'selected':''}>正在评价卡片</option><option value="waiting" ${stickerTarget==='waiting'?'selected':''}>等待卡片（所有等待者共用）</option></select></label><p class="hint">${stickerTarget==='current'?'观众进入评价时，自动使用这套装饰。':'现在及新加入的所有等待卡片，自动使用这套装饰。'}每个主题的两套装饰分别保存。</p><div class="row between"><span class="muted">${list.length} / 24 个挂件</span><div class="row">${button('add-sticker','＋ 添加','','class="small"')}${button('toggle-edit',editStickers?'完成编辑':'沿边调整','','class="small"')}</div></div><p class="hint">挂件中心固定在边框上。拖动只会沿边吸附，不能放入卡片内部或离开边缘。圆角处贴合直线边段。</p>${list.map((a,i)=>`<div class="row control-row"><span class="mini-sticker">${ornamentContent(a)}</span><button class="grow small" data-action="select-sticker" data-id="${esc(a.id)}" style="text-align:left">${esc(ornamentLabel(a))} ${i+1} · ${edgeNames[a.edge]}</button>${button('toggle-sticker',a.hidden?'显示':'隐藏',a.id,'class="small"')}${button('delete-sticker','×',a.id,'class="small" aria-label="删除挂件"')}</div>`).join('')}${st?`<div class="sticker-controls"><div class="grid2"><label>所在边框<select data-sticker-field="edge">${Object.entries(edgeNames).map(([k,n])=>`<option value="${k}" ${st.edge===k?'selected':''}>${n}</option>`).join('')}</select></label><label>沿边位置 %<input type="number" data-sticker-field="position" min="0" max="100" step="0.1" value="${st.position}"></label>${[['width','大小 px',16,400],['rotation','旋转 °',-180,180],['z','层级',0,9]].map(([k,n,min,max])=>`<label>${n}<input type="number" data-sticker-field="${k}" min="${min}" max="${max}" value="${st[k]}"></label>`).join('')}${st.kind==='text'?`<label>装饰文字<input data-sticker-field="value" maxlength="12" value="${esc(st.value)}"></label>`:''}</div><div class="toolbar">${button('replace-sticker','替换图片',st.id,'class="small"')}</div></div>`:''}<div class="toolbar">${button('reset-stickers','恢复这类卡片的默认装饰','','class="small"')}</div></div>`;}
function historyPanel(){return `<div class="section"><div class="row between"><h3 style="margin:0">已结束记录</h3><span class="muted">${doc.engine.history.filter(p=>p.status==='completed').length} 次已评价</span></div><div class="toolbar">${button('export-history','导出记录 TXT')}${button('clear-history','清空记录','','class="danger"')}</div><p class="hint">最近记录在上方。完成与移除分别记录，直播画面不展示这里的私人备注。</p>${doc.engine.history.slice().reverse().map(p=>personRow(p,'history')).join('')||'<div class="blank">完成第一位锐评后，记录会出现在这里</div>'}</div>`;}
function helpPanel(){return `<div class="help"><h3>锐评候场室 · 1.9</h3><p class="hint">一个 HTML 即可运行。主题、代码与默认挂件都已内置。</p><details open><summary>首次使用</summary><ol><li>在原有菘蓝插件宿主中导入此 HTML，沿用礼物通道。</li><li>默认已配置1个粉丝团灯牌普通排队。可在「礼物」修改名称和门槛，或添加插队、再次锐评规则，修改后点击保存。</li><li>先用模拟礼物演练；再送一份真实礼物核对用户信息与数量。</li><li>到「外观」选择主题并调整卡片、配色和挂件。</li><li>关闭控制台进入透明展示。双击空白处或按 Esc 恢复控制台；左下角悬停也能打开。</li></ol></details><details><summary>排队、插队和再次锐评</summary><p>普通排队每人只保留一个活动位置。插队排入等待优先区，多人插队按先后排序，不打断当前。再次锐评按规则增加机会，全部排到队尾。同一人可同时有多张机会卡。</p><p>当前评价卡片底部的「完成并下一位」无需打开控制台，点击后将当前移入历史并开始下一位；「只完成」暂停开始，直到手动点击开始下一位。移除当前也会暂停。移除不算已评价。</p><p>同一用户同一规则的礼物数量累计到门槛后触发；修改规则会清零该规则余数。单条再评超过 20 个机会会保留待处理，分批补入；最多 500 个活动机会、2000 条历史。</p></details><details><summary>头像、资料与备份</summary><p>收藏保存用户名、平台 ID、头像和私人备注。远程头像链接可能过期；资料编辑中可尝试保存本地副本，或直接上传头像。浏览器禁止跨域读取时会提示，不会假装已经永久保存。</p><p>上传支持 PNG/JPEG/WebP/GIF，单张最多 1.5MB、最长边 4096px。静态头像和挂件原文件内嵌保存；透明 PNG 保留透明度。GIF 可用但文件较大。</p><p>资料页「导出完整备份」包含队列、记录、规则、配色与已保存的图片。导入先预览并确认；预览期间数据变化须重新读取。浏览器存储拒绝时本页仍可临时使用，关闭前导出备份。</p></details><details><summary>透明画面与挂件</summary><p>页面空白区域始终透明，不再铺设棋盘格。OBS 首次加载默认进入展示模式；在 OBS 浏览器源的「交互」窗口双击空白处或按 Esc 打开控制台，设置完成后关闭控制台。卡片自身的底色通过不透明度单独调整。普通窗口采集可能显示浏览器底色。</p><p>不透明度 0–100% 只控制卡片底色，文字、头像和边框独立显示。八种主题分别保存配色，并分别保存正在评价卡片与等待卡片的装饰，每类 0–24 个。拖动标题或卡片空白处移动整个队列，右下角箭头等比缩放；控制台顶部 A−／A＋调整菜单字号。沿边调整时，挂件中心始终吸附边框；也可指定上／右／下／左边及沿边百分比。大小、旋转和层级可调。所有等待卡片共用等待模板，开始评价时自动换用评价模板。</p></details><details><summary>礼物接入与测试范围</summary><p>优先 SonglanPlugin.onGift；没有 SDK 时尝试 ws://localhost:9910，连接失败自动重试。没有昵称的礼物进入待处理。默认优先按平台 ID 识别，菘蓝未提供 ID 时按昵称＋头像识别（同名同头像无法区分）；严格模式下，无 ID 也进入待处理。</p><p>仅按明确事件 ID 去重，累计连击仅在消息带 comboId 与 isCumulative:true 时计算增量。真实平台若使用其他字段或累计协议，需要核对实际消息后适配。连击数量请先小额实测。</p><p>同一个队列请仅打开一个活动插件实例。不同浏览器或宿主的存储相互独立，需要手动备份迁移。</p></details><details><summary>版本记录</summary><p>1.9 · 2026-09-20：卡片和后台队列显示实时排位及前方人数；正在评价者算第1位，第一张等待卡片为第2位、前面1位。无人正在评价时第一张等待卡片为第1位、前面0位。插队、完成、移除和调整顺序自动更新。入队编号独立保留；同一观众的多次机会分别计位。</p><p>1.8 · 2026-09-20：长昵称取消单行省略，当前评价和等待卡片按完整文字自动换行、增高；控制台队列、历史和资料库同样完整显示长昵称与用户ID，支持连续英文、数字与表情。</p><p>1.7 · 2026-09-16：默认1个粉丝团灯牌普通排队，旧版空规则首次自动补入；用户删除后不会自动恢复。模拟下拉框明确显示无规则或未启用状态，可恢复默认规则。新增入队、换位和当前高亮动画，在外观中开启、关闭或跟随系统。</p><p>1.6 · 2026-09-16：整组队列支持拖动和右下角等比缩放，关闭控制台也能调整，位置与大小自动保存。挂件按未缩放卡片坐标计算，缩放后仍贴边。控制台默认18px，顶部A−／A＋可调到16–28px。保留1.5透明底修复。</p><p>1.5 · 2026-09-16：修复嵌套网页明暗模式不一致时的白底；页面空白区域不再铺预览底纹；OBS 首次加载默认透明展示，控制台可通过「交互」手动打开。增加父页面透底像素验证。</p><p>1.4 · 2026-09-16：八主题新增独立卡片结构、边框、头像框、排版和16个内置图形挂件。安装版菘蓝实际模拟格式已核对，无用户ID时支持昵称＋头像本地识别及严格模式；修正直连端口为9910并发送模块身份声明。原默认符号升级为图形，保留上传图片与自定义文字位置。</p><p>1.3 · 2026-09-16：挂件改为吸附卡片边框，只能沿边调整。「正在评价」和「等待」各有独立装饰模板，新卡片自动复用，开始评价时自动切换模板。旧版挂件保留并吸附到最近边缘，分别复制到两类模板，可再单独修改。</p><p>1.2 · 2026-09-16：在正在评价卡片底部增加「完成并下一位」，关闭控制台后可以直接操作。暂停时队列显示「开始下一位」，空队列按钮禁用。控制台与队列按钮共用防连点和保存中保护。</p><p>1.1 · 2026-09-16：新增「外观 → 上屏文字」，支持修改主标题和评价状态标签。兼容旧备份，旧记录未设置状态标签时显示「正在评价」。升级建议先导出备份；换文件或宿主后如未自动恢复，可导入备份。</p><p>1.0 · 2026-09-16：首次发布。新增礼物排队、优先插队、重复锐评、评价历史、用户资料库、八主题、自定义配色、不透明度与自由挂件。隐藏署名只用于标识作者，不发送数据。</p></details><div class="section"><h3>存储维护</h3><div class="toolbar">${button('export','导出完整备份')}${button('import','导入备份')}${corruptRaw!==null?button('export-corrupt','导出异常原记录'):''}${button('retry-storage','重新尝试保存')}</div><p class="hint">备份文件含用户资料，请妥善保存。新页面没有演示观众，默认启用1个粉丝团灯牌加入普通队列。</p></div></div>`;}
function modal(html){$('modal-content').innerHTML=html;if(!$('modal').open)$('modal').showModal();}
function confirmAction(title,description,fn){modal(`<h3>${esc(title)}</h3><p>${esc(description)}</p><div class="modal-actions"><button id="cancel-dialog">取消</button><button id="confirm-dialog" class="primary">确认</button></div>`);$('cancel-dialog').onclick=()=>$('modal').close();$('confirm-dialog').onclick=async()=>{const ok=await fn();if(ok!==false)$('modal').close();};}
function personDialog(p=null,{profile=false,pending=null}={}){p=p?resolved(p):{key:'',uid:'',name:'',avatar:'',note:''};modal(`<h3>${pending?'核对并补入':profile?'保存用户资料':p.id?'编辑观众':'手动添加观众'}</h3><div class="stack"><label>昵称<input id="p-name" maxlength="200" value="${esc(p.name)}" required></label><label>平台用户 ID（可留空）<input id="p-uid" maxlength="180" value="${esc(p.uid)}" ${p.key?'readonly':''}></label><label>私人备注<textarea id="p-note" maxlength="2000">${esc(p.note)}</textarea></label>${!profile&&!p.id?`<div class="grid2"><label>加入方式<select id="p-kind">${Object.entries(names).map(([k,n])=>`<option value="${k}" ${pending?.gift.requestedKind===k?'selected':''}>${n}</option>`).join('')}</select></label><label>再评机会数<input id="p-opportunities" type="number" min="1" max="20" value="${Math.min(20,pending?.gift.requestedOpportunities||1)}"></label></div>`:''}${p.avatar?`<div class="row">${avatar(p)}<div class="grow hint">${p.avatar.startsWith('data:')?'头像已内嵌保存':'当前为远程头像链接，建议保存本地副本'}</div>${p.key?button('cache-avatar','保存本地副本',p.key,'class="small"'):''}</div>`:''}${pending?.gift.quantityIssue?`<label>原始数量：${esc(pending.gift.rawCount)}。核对后的礼物数量<input id="p-corrected-count" type="number" min="1" max="10000" value=""></label>`:''}${pending?`<div class="notice">${esc(pending.reason)}${!pending.gift.awardReady?'；核对后将按原规则重新累计数量，不直接发放机会。':''}${pending.gift.requestedOpportunities>20?'；此次最多补入 20 个，剩余机会继续保留待处理。':''}</div>`:''}</div><div class="modal-actions"><button id="cancel-person">取消</button><button id="submit-person" class="primary">${profile||p.id?'保存':'加入队列'}</button></div>`);
 $('cancel-person').onclick=()=>$('modal').close();$('submit-person').onclick=async()=>{if($('submit-person').disabled)return;const name=$('p-name').value.trim(),uid=$('p-uid').value.trim(),note=$('p-note').value;if(!name){notify('请填写昵称');return;}$('submit-person').disabled=true;const q={key:p.key||(pending?M.identityKey({userId:uid,nickname:name,avatar:p.avatar||''},'display'):(uid?'uid:'+uid:'manual:'+uuid())),uid,name,note,avatar:p.avatar||''};const kind=$('p-kind')?.value||'join',opportunities=Number($('p-opportunities')?.value||1),correctedCount=$('p-corrected-count')?Number($('p-corrected-count').value):null;
 const ok=await transact(d=>{if(profile){d.engine=E.apply(d.engine,{type:'profile',person:q});}else if(p.id){d.engine=E.apply(d.engine,{type:'edit',id:p.id,name,note});if(d.engine.profiles.some(x=>x.key===q.key))d.engine=E.apply(d.engine,{type:'profile',person:q});}else{if(pending){const live=d.engine.pending.find(x=>x.id===pending.id);if(!live||JSON.stringify(live)!==JSON.stringify(pending))throw Error('这条待处理记录已经变化，请重新核对');if(!live.gift.awardReady){const originalRule=d.rules.find(r=>r.id===live.gift.ruleId);if(!d.giftsEnabled||!originalRule?.enabled||originalRule.name.normalize('NFKC').trim().toLowerCase()!==String(live.gift.name).normalize('NFKC').trim().toLowerCase()||originalRule.kind!==live.gift.requestedKind||originalRule.min!==live.gift.threshold)throw Error('原礼物规则已停用或变化，请恢复原规则后处理；也可核对后手动登记再忽略本条');if(!uid&&d.identityMode==='strict')throw Error('严格模式需要平台用户 ID；菘蓝未提供时可切换昵称＋头像模式后再核对');d.engine=E.apply(d.engine,{type:'pendingRemove',id:pending.id});if(live.gift.quantityIssue&&(!Number.isInteger(correctedCount)||correctedCount<1||correctedCount>10000))throw Error('请填写核对后的数量 1–10000；超出部分请另行手动登记');d=M.route(d,{...live.gift,userId:uid,nickname:name,...(live.gift.quantityIssue?{quantityIssue:'',count:correctedCount}: {})});return d;}const earned=live.gift.requestedOpportunities;if(!Number.isInteger(earned)||earned<1)throw Error('机会数量无效，请核对原始礼物');if(kind!==live.gift.requestedKind)throw Error('已获得机会请保持原礼物类型');if(kind==='repeat'&&opportunities>earned)throw Error('不能补入超过已获得的机会数');}
 d.engine=E.apply(d.engine,{type:kind,person:q,opportunities:kind==='repeat'?opportunities:1,source:pending?'待处理礼物补入':'手动添加'});if(pending){const remaining=pending.gift.requestedOpportunities-(kind==='repeat'?opportunities:1);d.engine=E.apply(d.engine,{type:'pendingRemove',id:pending.id});if(remaining>0)d.engine=E.apply(d.engine,{type:'pendingAdd',gift:{...pending.gift,requestedOpportunities:remaining},reason:'剩余 '+remaining+' 个机会待补入'});}}return d;},{message:profile?'用户资料已保存':'队列已更新'});if(ok)$('modal').close();else if($('submit-person'))$('submit-person').disabled=false;};}
function saveRules(){const rules=[...document.querySelectorAll('[data-rule]')].map(row=>{const get=k=>row.querySelector(`[data-rule-field="${k}"]`);return {id:row.dataset.rule,name:get('name').value.trim(),kind:get('kind').value,min:Number(get('min').value),opportunities:Number(get('opportunities')?.value||1),enabled:get('enabled').checked};});return transact(d=>{const unchanged=new Set(rules.filter(r=>JSON.stringify(r)===JSON.stringify(d.rules.find(old=>old.id===r.id))).map(r=>r.id));d.rules=rules;d.receipts=Object.fromEntries(Object.entries(d.receipts).filter(([k])=>{try{return unchanged.has(JSON.parse(k)[0]);}catch{return false;}}));return d;},{message:'礼物规则已保存；仅重置修改规则的未满门槛累计'});}
function giftReceived(gift){pendingWrites++;const protocol=transport?clone(transport.exportState()):null;const task=queue.then(async()=>{let next;try{next=M.route(doc,gift);next.transport=protocol;next=M.validate(next);}catch(e){lostGifts.push({gift,reason:e.message,time:Date.now()});warning();if(opened&&tab==='queue')renderPanel();notify('礼物未入队：'+e.message);return;}try{if(corruptRaw!==null)throw Error('旧记录已保护');await S.write(next);storageError='';}catch(e){storageError='礼物已在本页处理，但未保存。关闭前请导出备份。';}doc=next;serial++;warning();renderStage();renderFooter();if(opened&&tab!=='gifts'&&tab!=='appearance')renderPanel();});queue=task.catch(e=>{notify(e.message);}).finally(()=>{pendingWrites--;});return task;}
function connect(){if(transport)transport();transport=ReviewTransport.connect({onGift:giftReceived,onStatus:text=>{$('connection-status').textContent=text;$('connection-dot').classList.toggle('on',/已连接/.test(text));},savedState:doc.transport});}
function download(name,text,type='application/json'){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);}
async function exportBackup(){await queue;download('锐评排队备份-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(doc,null,2));notify('备份已导出，包含已内嵌的头像和挂件');}
function imageDimensions(src){return new Promise((resolve,reject)=>{const img=new Image(),timer=setTimeout(()=>{img.src='';reject(Error('图片读取超时'));},8000);img.onload=()=>{clearTimeout(timer);if(!img.naturalWidth||img.naturalWidth>4096||img.naturalHeight>4096)reject(Error('图片最长边不能超过 4096px'));else resolve();};img.onerror=()=>{clearTimeout(timer);reject(Error('图片无法解码，请换一张 PNG/JPEG/WebP/GIF'));};img.src=src;});}
function fileData(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('文件读取失败'));reader.onabort=()=>reject(Error('文件读取已取消'));reader.readAsDataURL(file);});}
async function checkedImage(file){if(!/^image\/(png|jpeg|webp|gif)$/.test(file.type))throw Error('只支持 PNG/JPEG/WebP/GIF 图片');if(file.size>1572864)throw Error('单张图片不能超过 1.5MB');const src=await fileData(file);await imageDimensions(src);return src;}
function requestImage(target){if(target.kind==='sticker'){target={...target,cardKind:$('panel-content').dataset.editCardKind};}uploadToken++;uploadTarget={...target,token:uploadToken};$('image-file').value='';$('image-file').click();}
$('image-file').onchange=async()=>{const target=uploadTarget,file=$('image-file').files[0];if(!file||!target)return;try{const value=await checkedImage(file);if(target.token!==uploadToken)throw Error('已忽略过期图片读取');const ok=await transact(d=>{if(target.token!==uploadToken)throw Error('已忽略过期图片读取');if(target.kind==='avatar'){const existing=d.engine.profiles.find(p=>p.key===target.key);if(!existing)throw Error('用户资料已被移除，请重新选择');d.engine=E.apply(d.engine,{type:'profile',person:{...existing,avatar:value}});}else{if(d.settings.theme!==target.theme)throw Error('主题已切换，请在目标主题重新上传');if(stickerTarget!==target.cardKind)throw Error('卡片类型已切换，请重新上传');const list=d.settings.skins[target.theme].decorations[target.cardKind];if(target.id){const a=list.find(a=>a.id===target.id);if(!a)throw Error('挂件已移除');a.kind='image';a.value=value;}else{if(list.length>=24)throw Error('每主题最多 24 个挂件');const id=uuid();list.push({id,kind:'image',value,edge:'top',position:80,width:80,rotation:0,z:2,hidden:false});selectedSticker=id;}}return d;},{asset:true,message:'图片已解码并保存'});if(ok&&$('modal').open)$('modal').close();}catch(e){notify(e.message);}};
async function cacheAvatar(key){const p=doc.engine.profiles.find(p=>p.key===key)||active().find(p=>p.key===key);if(!p?.avatar){notify('这个用户还没有头像');return;}if(p.avatar.startsWith('data:')){notify('头像已经保存在本地');return;}const old=p.avatar;try{const response=await fetch(old,{mode:'cors',credentials:'omit',referrerPolicy:'no-referrer',signal:AbortSignal.timeout(8000)});if(!response.ok)throw Error('头像地址不可读取');const blob=await response.blob(),value=await checkedImage(blob);await transact(d=>{const latest=d.engine.profiles.find(x=>x.key===key)||[d.engine.current,...d.engine.waiting].find(x=>x?.key===key);if(!latest||latest.avatar!==old)throw Error('头像已变化，请重新保存');d.engine=E.apply(d.engine,{type:'profile',person:{...person(latest),avatar:value}});return d;},{asset:true,message:'头像本地副本已保存'});}catch(e){notify('无法保存远程头像，可能受跨域限制；请在资料页上传头像。');}}
$('backup-file').onchange=async()=>{const file=$('backup-file').files[0],token=++backupToken,epoch=serial;if(!file)return;try{if(file.size>35000000||!/\.json$/i.test(file.name))throw Error('请选择不超过 35MB 的 JSON 备份');const candidate=M.validate(JSON.parse(await file.text()));const images=new Set();for(const skin of Object.values(candidate.settings.skins))for(const a of [...skin.decorations.current,...skin.decorations.waiting])if(a.kind==='image'&&a.value.startsWith('data:'))images.add(a.value);for(const p of [candidate.engine.current,...candidate.engine.waiting,...candidate.engine.history,...candidate.engine.profiles].filter(Boolean))if(p.avatar.startsWith('data:'))images.add(p.avatar);for(const src of images)await imageDimensions(src);if(token!==backupToken)throw Error('备份读取已过期');modal(`<h3>核对导入备份</h3><p>文件：${esc(file.name)}</p><div class="notice">正在评价 ${candidate.engine.current?1:0} 位 · 等待 ${candidate.engine.waiting.length} 个机会<br>收藏 ${candidate.engine.profiles.length} 人 · 历史 ${candidate.engine.history.length} 条<br>主题：${T.themes.find(t=>t.id===candidate.settings.theme).name}<br>确认后替换当前队列、规则、资料与外观。</div><div class="preview-users">${[candidate.engine.current,...candidate.engine.waiting.slice(0,8)].filter(Boolean).map(p=>`<p>${esc(p.name)} · No. ${p.ticket}</p>`).join('')}</div><div class="modal-actions"><button id="cancel-import">取消</button><button id="confirm-import" class="primary">确认替换</button></div>`);$('cancel-import').onclick=()=>{$('modal').close();backupToken++;};$('confirm-import').onclick=async()=>{if(token!==backupToken||epoch!==serial){notify('预览后队列或配置已变化，请重新选择备份核对');$('modal').close();return;}const ok=await transact(()=>{if(token!==backupToken||epoch!==serial)throw Error('数据已变化，请重新预览');return clone(candidate);},{asset:true,message:'备份已导入'});if(ok){$('modal').close();connect();}};}catch(e){notify('未导入：'+e.message);}};

 case'add-builtin-sticker':case'add-text-sticker':{const st={id:uuid(),kind:a==='add-builtin-sticker'?'builtin':'text',value:id,edge:'top',position:80,width:44,rotation:0,z:2,hidden:false};selectedSticker=st.id;const ok=await mutateDecor(list=>{if(list.length>=24)throw Error('每种卡片装饰最多 24 个挂件');list.push(st);});if(ok)$('modal').close();break;}

$('panel-content').addEventListener('change',e=>{const t=e.target,ownerTheme=$('panel-content').dataset.editTheme,ownerKind=$('panel-content').dataset.editCardKind;

 if(t.dataset.color||t.dataset.colorText){const k=t.dataset.color||t.dataset.colorText,value=t.value;if(!T.color(value)){notify('请输入 #RRGGBB 格式的颜色');renderPanel();return;}transact(d=>{if(d.settings.theme!==ownerTheme)throw Error('主题已切换，请重新修改颜色');d.settings.skins[ownerTheme][k]=value;return d;});return;}

 if(t.id.startsWith('s-')){const key=t.id.slice(2),value=t.type==='checkbox'?t.checked:t.type==='number'?Number(t.value):t.value;transact(d=>{d.settings[key]=value;return d;});return;}

let drag=null;
$('stage').addEventListener('pointerdown',e=>{const target=e.target.closest('[data-sticker]'),card=target?.closest('[data-card-kind]');if(!target||!card||!editStickers||!opened||card.dataset.cardKind!==stickerTarget)return;const st=doc.settings.skins[doc.settings.theme].decorations[stickerTarget].find(a=>a.id===target.dataset.sticker);if(!st)return;queueMotion.cancel();const geometry=cardGeometry(card),rect=card.getBoundingClientRect(),point=T.edgePoint(st.edge,st.position,geometry.width,geometry.height,geometry.radius,geometry.border);selectedSticker=st.id;drag={id:st.id,theme:doc.settings.theme,cardKind:stickerTarget,element:target,card,rect,geometry,pointer:e.pointerId,offsetX:(e.clientX-rect.left)/geometry.scaleX-point.x,offsetY:(e.clientY-rect.top)/geometry.scaleY-point.y};target.setPointerCapture(e.pointerId);e.preventDefault();});

function placeStage(layout){const stage=$('stage');stage.style.left=layout.x+'%';stage.style.top=layout.y+'%';stage.style.setProperty('--stage-scale',layout.scale);stage.style.setProperty('--handle-scale',1/layout.scale);}
function commitStagePlacement(placement){const token=++stagePlacementSequence;pendingStagePlacement={...placement};return transact(d=>{Object.assign(d.settings,placement);return d;}).then(ok=>{if(token===stagePlacementSequence){pendingStagePlacement=null;if(!stageGesture)renderStage();}return ok;});}

$('stage').addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('.sticker'))return;const resize=e.target.closest('#stage-resize'),move=e.target.closest('#stage-move');if(!resize&&!move&&e.target.closest('button,input,select,textarea,a'))return;if(drag)return;queueMotion.cancel();const stage=$('stage'),canvas=$('canvas'),start=pendingStagePlacement||doc.settings;stageGesture={kind:resize?'resize':'move',pointer:e.pointerId,startX:e.clientX,startY:e.clientY,width:stage.offsetWidth,height:stage.offsetHeight,canvasWidth:canvas.clientWidth,canvasHeight:canvas.clientHeight,start:{x:start.x,y:start.y,scale:start.scale},preview:{x:start.x,y:start.y,scale:start.scale},moved:false};stage.setPointerCapture(e.pointerId);stage.classList.add('stage-transforming');e.preventDefault();});
document.addEventListener('pointermove',e=>{const g=stageGesture;if(!g||e.pointerId!==g.pointer)return;const dx=e.clientX-g.startX,dy=e.clientY-g.startY;if(!g.moved&&Math.hypot(dx,dy)<4)return;g.moved=true;let x=g.start.x,y=g.start.y,scale=g.start.scale;if(g.kind==='move'){x+=dx/g.canvasWidth*100;y+=dy/g.canvasHeight*100;}else scale=T.resizeStageScale({startScale:scale,width:g.width,height:g.height,dx,dy});const position=stageBounds(x,y,scale,g.width,g.height);g.preview={...position,scale};placeStage(g.preview);positionCardDecorations();e.preventDefault();});
document.addEventListener('pointerup',e=>{const g=stageGesture;if(!g||e.pointerId!==g.pointer)return;stageGesture=null;$('stage').classList.remove('stage-transforming');if(!g.moved)return;suppressDoubleClickUntil=Date.now()+700;const placement={...g.preview};commitStagePlacement(placement);});

for(const id of ['stage-move','stage-resize'])$(id).addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();const positive=e.key==='ArrowRight'||e.key==='ArrowDown',base=pendingStagePlacement||doc.settings;let scale=base.scale,x=base.x,y=base.y;if(id==='stage-resize')scale=Math.max(.5,Math.min(2.5,Math.round((scale+(positive?.05:-.05))*100)/100));else{const step=e.shiftKey?5:1;if(e.key==='ArrowLeft'||e.key==='ArrowRight')x+=positive?step:-step;else y+=positive?step:-step;}commitStagePlacement({...stageBounds(x,y,scale),scale});});

renderStage();renderFooter();warning();connect();if((fresh||storageError)&&!ReviewSurface.capture)openPanel();if(storageError&&ReviewSurface.capture)notify('存储暂不可用，请用 OBS 交互打开控制台并导出备份');
})();

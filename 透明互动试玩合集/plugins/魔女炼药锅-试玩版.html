  function render(){const g=engine,isPlaying=g.active,isResult=g.phase==='result',isComplete=g.phase==='complete',ready=g.phase==='ready',paused=g.phase==='paused';document.documentElement.style.setProperty('--brew',g.recipe.color);$('stage').classList.toggle('hot',g.hot);$('stage').classList.toggle('paused',paused);$('recipeKicker').textContent=`第 ${g.order+1} / ${g.config.orders} 单 · ${g.hidden>0?'配方暂时隐藏':'今日配方'}`;$('recipeName').textContent=g.hidden>0?'配方藏进迷雾了':g.recipe.name;$('stage').classList.toggle('veiled',g.hidden>0);$('stage').classList.toggle('stirring',g.holding);$('stage').classList.toggle('has-fire',isPlaying);$('stage').style.setProperty('--heat',g.heatLevel);recipeItems();$('orderPips').innerHTML=Array.from({length:g.config.orders},(_,i)=>`<i class="${g.history[i]?(g.history[i].ok?'good':'bad'):(i===g.order&&!ready?'current':'')}"></i>`).join('');$('score').textContent=ready?'等待第一位客人':`已完成 ${g.history.length} / ${g.config.orders} · 好药 ${g.history.filter(x=>x.ok).length} 瓶`;
    document.querySelectorAll('[data-ingredient]').forEach(b=>b.disabled=!isPlaying||g.items.length>=2||g.holding);document.querySelectorAll('[data-gift]').forEach(b=>b.disabled=!isPlaying);$('dropIngredient').disabled=!isPlaying;$('pause').disabled=!isPlaying&&!paused;$('pause').textContent=paused?'继续本局':'暂停本局';$('temperature').textContent=g.hot?'高温 · 区间收窄':'温火';$('temperature').style.color=g.hot?'#ffb993':'#91efd5';
    $('potContents').innerHTML=g.items.length?g.items.map(id=>`<span class="content-token" title="${names[id]}">${icon(id)}</span>`).join(''):'<span class="empty-token">+</span><span class="empty-token">+</span>';
    $('result').hidden=isPlaying;$('result').classList.toggle('ready',ready);$('mainAction').disabled=paused||(isPlaying&&g.items.length<2);$('mainAction').classList.toggle('holding',g.holding);
    if(ready){$('resultArt').innerHTML='<use href="#potion"/>';$('resultTitle').textContent='今夜，小店开张';$('resultText').textContent='配方里的两份材料，少一份都不行。';$('mainAction').innerHTML=`开 始 营 业 <span>接下今晚的 ${g.config.orders} 份订单</span>`;$('instruction').textContent='看配方 → 投入两份材料 → 按住搅拌再松手';$('brewStatus').textContent='配方已备好，等你开锅';}
    else if(paused){$('resultArt').innerHTML='<use href="#moon"/>';$('resultTitle').textContent='炉火暂歇';$('resultText').textContent='计时已暂停，点互动台「继续本局」。';$('mainAction').textContent='暂 停 中';$('brewStatus').textContent='药锅与互动均已暂停';$('instruction').textContent='刚才的搅拌已取消，继续后可重新按住';}
    else if(isComplete){const good=g.history.filter(x=>x.ok).length;$('resultArt').innerHTML='<use href="#potion"/>';$('resultTitle').textContent=good>=Math.ceil(g.config.orders*.8)?'月光魔药师，收工！':'奇妙的一夜，收工！';$('resultText').textContent=`${g.config.orders} 份订单已完成 · ${good} 瓶好药 · ${g.config.orders-good} 次意外惊喜`;$('mainAction').innerHTML=`再 开 一 班 <span>重新接 ${g.pendingConfig.orders} 份订单</span>`;$('instruction').textContent='每一次翻车，也是魔法的一部分。';$('brewStatus').textContent='今晚的小店，打烊啦';}
    else if(isResult){$('resultArt').innerHTML=`<use href="#${g.result.kind}"/>`;const failures={frog:'糟糕，熬出一只蛙',mushroom:'锅里长蘑菇了！',eyes:'这锅药，正在看你'};$('resultTitle').textContent=g.result.ok?'好药出锅！':failures[g.result.kind];$('resultText').textContent=g.result.ok?g.recipe.note:({recipe:'材料不对：需要恰好两份配方材料。',timing:'火候差一点：请在绿色区松开。',timeout:`火候过头了：${g.config.seconds} 秒内记得出锅。`}[g.result.reason]);$('mainAction').innerHTML=g.history.length===g.config.orders?'今 夜 收 工 <span>查看营业小结</span>':'接 下 一 单 <span>准备新的魔法</span>';$('instruction').textContent=g.result.ok?'配方正确，火候刚刚好。':'点击下一单，意外留在这一锅。';$('brewStatus').textContent=g.result.ok?'星光封瓶，订单完成':'魔法偏航，但是可爱';}
    else{const n=g.items.length;$('mainAction').innerHTML=g.holding?'绿 色 区 松 手 <span>现在松开即可出锅</span>':n>=2?'按 住 搅 拌 <span>或按住空格键</span>':'先 投 入 材 料 <span>点击上方材料瓶</span>';$('instruction').textContent=n>2?'锅里有额外材料！可用互动台「清锅重来」救场。':'按住让指针前进，在绿色区松手；无需连续点击。';$('brewStatus').textContent=g.holding?'轻轻搅拌，等火候刚好':n===0?'按配方投料 · 两份即可':n===1?'已投入一份，再加一份':'材料入锅，准备搅拌';}progress();}
  function add(id){if(engine.add(id)){fly(id);sound();render();}else if(engine.active)log('这锅已经放好材料，可搅拌出锅或清锅重做。');}
  function begin(source){if(engine.hold()){holdSource=source;render();return true;}return false;}
  function release(source){if(holdSource!==source)return;holdSource=null;if(engine.release()){sound(engine.result.ok);render();}}
  function cancel(){holdSource=null;engine.cancelHold();render();}
  function pauseAuto(){if(engine.active){holdSource=null;engine.togglePause();log('已自动暂停。回来后点「继续本局」，不会自动出锅。');render();}}
  document.querySelectorAll('[data-ingredient]').forEach(b=>b.addEventListener('click',()=>add(b.dataset.ingredient)));
  document.querySelectorAll('[data-gift]').forEach(b=>b.addEventListener('click',()=>{const type=b.dataset.gift,id=$('dropIngredient').value;if(engine.gift(type,id)){if(type==='drop')fly(id);if(type==='clean'){clearHeld();pulse('cleaning',1200);}if(type==='heat')pulse('heat-surge',1100);if(type==='cool'){pulse('cooling',1000);splash('#b8fff2');}const msg={drop:`观众扔进一份${names[id]}，锅中已有 ${engine.items.length} 份材料。`,heat:'火温升高！绿色出锅区收窄了。',veil:'配方被藏起 4 秒，药锅继续计时。',cool:'一阵清凉：恢复温火，补回最多 4 秒。',clean:`药锅洗干净了，仍是当前订单；重新给你 ${engine.config.seconds} 秒。`};log(msg[type]);sound();render();}else if(type==='drop')log('锅中最多容纳 6 份材料，请先出锅或清锅。');}));
  $('mainAction').addEventListener('click',()=>{if(engine.phase==='ready'||engine.phase==='complete'){engine.start();log('营业开始！按配方投两份材料，然后按住搅拌。');sound();render();}else if(engine.phase==='result'){engine.next();render();}});
  $('mainAction').addEventListener('pointerdown',e=>{if(e.button!==0||!engine.active)return;if(begin('pointer')){e.preventDefault();pointerId=e.pointerId;$('mainAction').setPointerCapture(e.pointerId);}});
  $('mainAction').addEventListener('pointerup',()=>release('pointer'));
  $('mainAction').addEventListener('pointercancel',cancel);
  $('mainAction').addEventListener('lostpointercapture',()=>{if(holdSource==='pointer')cancel();});
  function inField(target){return target instanceof Element&&(!!target.closest('aside,input,select,textarea,[contenteditable="true"]')||(!target.closest('#stage')&&target!==document.body));}
  document.addEventListener('keydown',e=>{if(e.isComposing||e.keyCode===229)return;if(e.key==='Escape'){if(e.target instanceof Element&&e.target.closest('input,select,textarea,[contenteditable="true"]'))return;e.preventDefault();if(!e.repeat)togglePanel();return;}if(inField(e.target)||e.repeat)return;if(e.code==='Space'){if(e.target instanceof Element&&e.target.closest('button')&&e.target.id!=='mainAction')return;if(engine.active){e.preventDefault();begin('keyboard');}}else if(/^Digit[123]$/.test(e.code)&&engine.active){e.preventDefault();add(['moon','dew','ember'][Number(e.code.slice(-1))-1]);}});
  document.addEventListener('keyup',e=>{if(e.code==='Space'&&holdSource==='keyboard'){e.preventDefault();if(e.isComposing||inField(e.target))cancel();else release('keyboard');}});
  document.addEventListener('compositionstart',()=>{if(holdSource)cancel();});
  $('pause').addEventListener('click',()=>{holdSource=null;if(engine.togglePause()){log(engine.active?'继续营业。重新按住搅拌即可。':'已暂停计时与互动。');render();}});
  function togglePanel(force){$('panel').hidden=typeof force==='boolean'?!force:!$('panel').hidden;$('panelToggle').setAttribute('aria-expanded',String(!$('panel').hidden));}
  $('panelToggle').addEventListener('click',()=>togglePanel());$('closePanel').addEventListener('click',()=>togglePanel(false));
  document.addEventListener('dblclick',e=>{if(!(e.target instanceof Element)||e.target.closest('button,aside,select,input,.recipe,.ingredient-shelf,.action-zone,.result'))return;togglePanel();});
  $('sound').addEventListener('change',()=>{settings.sound=$('sound').checked;saveSettings();sound();});$('motion').addEventListener('change',()=>{settings.motion=$('motion').value;applySettings();saveSettings();});
  document.addEventListener('overlay-manager-open',pauseAuto);window.addEventListener('blur',pauseAuto);document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseAuto();last=performance.now();});
  function resize(){document.documentElement.style.setProperty('--scale',Math.min(window.innerWidth/1120,window.innerHeight/780,1.2));}window.addEventListener('resize',resize);
  function frame(now){const dt=Math.min((now-last)/1000,1);last=now;const oldPhase=engine.phase,wasHidden=engine.hidden>0;engine.tick(dt);if(engine.phase!==oldPhase){holdSource=null;sound(engine.result?.ok);render();}else if(wasHidden&&engine.hidden===0){render();}else progress();requestAnimationFrame(frame);}
  const baseRender=render;render=function(){baseRender();visualState();};
  applySettings();resize();togglePanel(true);render();requestAnimationFrame(frame);
  const adapter={
    id:'witch-potion',title:'魔女炼药锅',
    defaults:{orders:5,seconds:15,difficulty:2},
    fields:[{key:'orders',label:'每班订单（下一班）',type:'number',min:3,max:10,default:5},{key:'seconds',label:'每单秒数（下一班）',type:'number',min:10,max:60,default:15},{key:'difficulty',label:'难度 1轻松/2标准/3挑战（下一班）',type:'number',min:1,max:3,default:2}],
    effects:[{id:'drop-moon',label:'投入月晶粉',defaultAmount:1,max:6,unit:'份'},{id:'drop-dew',label:'投入晨露滴',defaultAmount:1,max:6,unit:'份'},{id:'drop-ember',label:'投入萤火籽',defaultAmount:1,max:6,unit:'份'},{id:'heat',label:'火温升高',defaultAmount:1,max:3,unit:'档'},{id:'veil',label:'遮住配方',defaultAmount:4,max:30,unit:'秒'},{id:'cool',label:'降温补时',defaultAmount:4,max:60,unit:'秒'},{id:'clean',label:'清锅重做当前单',defaultAmount:1,max:1,unit:'次'}],
    applyConfig(config){engine.configure(config);render();if(engine.phase!=='ready')log('玩法配置已保存，将从下一班营业生效。');},
    getState(){return engine.snapshot();},
    restoreState(s){engine.restore(s);clearHeld();visualGeneration++;last=performance.now();lastVisualState='';$('flyingIngredient').replaceChildren();$('splashFX').replaceChildren();for(const [cls,timer]of pulses){clearTimeout(timer);$('stage').classList.remove(cls);}pulses.clear();log('存档已恢复并暂停。点「继续本局」后再开始操作。');render();},
    effect(id,amount,name){const drop=id.startsWith('drop-'),material=drop?id.slice(5):null,type=drop?'drop':id;if(!engine.effect(type,amount,material))return false;if(drop)fly(material);if(type==='clean'){clearHeld();pulse('cleaning',1200);}if(type==='heat')pulse('heat-surge',1100);if(type==='cool'){pulse('cooling',1000);splash('#b8fff2');}log(`${String(name||'观众').slice(0,40)} · ${adapter.effects.find(x=>x.id===id)?.label||id} × ${amount}（按可作用上限结算）`);sound();render();return true;},
    isPlaying(){return engine.active;},
    onSettings(common){if(Number.isFinite(common.volume)){settings.volume=Math.max(0,Math.min(1,common.volume));settings.sound=settings.volume>0;}if(['on','system','off'].includes(common.motion))settings.motion=common.motion;applySettings();},
    describeState(s){return `第 ${s.order+1}/${s.config.orders} 单 · 完成 ${s.history.length} 单 · 剩余 ${Math.ceil(s.time)} 秒 · 恢复后暂停`;}
  };
  if(window.OverlayKit){window.OverlayKit.mount(adapter);document.querySelector('.panel-heading h2').textContent='快捷互动';document.querySelector('.panel-heading p').textContent='快捷模拟 · 接入设置见管理面板';}
})();
</script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>白曜 · 透明互动实验室</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:'Microsoft YaHei UI','Microsoft YaHei',sans-serif;background:#121619;color:#e9e9e0}body{display:flex;flex-direction:column}button,a{font:inherit}header{padding:18px 25px 14px;display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid #ffffff12;background:#151a1e}h1{font-size:18px;letter-spacing:3px;margin:0;font-weight:600}.wordmark{color:#d9b48a;margin-right:13px}.caption{font-size:10px;color:#859094;margin-top:7px}.tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.tools span{font-size:10px;color:#849095;margin-right:6px}button{cursor:pointer}.swatch{width:23px;height:23px;border:2px solid #6f7474;border-radius:50%;background:#222c30;padding:0}.swatch[data-bg="light"]{background:#e6ddd0}.swatch[data-bg="grid"]{background:conic-gradient(#747b7d 25%,#c0c5c3 0 50%,#747b7d 0 75%,#c0c5c3 0);background-size:10px 10px}.swatch[data-bg="live"]{background:linear-gradient(145deg,#65496d,#253f4b)}.swatch.active{outline:2px solid #dec098;outline-offset:3px}.tools a,.tools .reset{font-size:10px;color:#d4c6b3;background:#2a3032;border:1px solid #45494a;text-decoration:none;border-radius:6px;padding:7px 11px;margin-left:10px}.tabs{display:flex;padding:12px 25px;gap:8px;border-bottom:1px solid #ffffff0d;background:#151a1e}.tab{border:1px solid #ffffff13;border-radius:8px;color:#aeb8b9;background:#20272a;padding:11px 18px;font-size:12px;display:flex;gap:10px;align-items:center}.tab .number{font:10px monospace;color:#788485}.tab.active{background:#c9ad84;color:#252623;border-color:#dec5a2;box-shadow:0 2px 10px #0002}.tab.active .number{color:#67593e}.view{flex:1;min-height:0;position:relative;background:radial-gradient(ellipse at 48% 28%,#35433f,#142023 70%);transition:background .2s;overflow:auto}.view.light{background:#e6ddd0}.view.grid{background-color:#bfc6c4;background-image:linear-gradient(45deg,#808986 25%,transparent 25%),linear-gradient(-45deg,#808986 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#808986 75%),linear-gradient(-45deg,transparent 75%,#808986 75%);background-size:36px 36px;background-position:0 0,0 18px,18px -18px,-18px 0}.view.live{background:radial-gradient(ellipse at 13% 56%,#597b8399,transparent 40%),radial-gradient(ellipse at 80% 20%,#a4746866,transparent 40%),linear-gradient(130deg,#273944,#4d3d58 60%,#263932)}iframe{width:100%;height:100%;min-height:760px;border:0;display:block;background:transparent}.hint{position:absolute;bottom:12px;right:22px;background:#151c20cc;border:1px solid #ffffff13;padding:7px 11px;border-radius:7px;font-size:9px;color:#b4c0c0;pointer-events:none}.footer{font-size:10px;color:#7e8a8c;display:flex;justify-content:space-between;padding:9px 25px;background:#151a1e;border-top:1px solid #ffffff10;gap:12px}.footer span:last-child{color:#b0a08b}
@media(max-width:800px){header{padding:13px 14px;align-items:flex-start}.caption{font-size:9px}.tools{max-width:200px;justify-content:flex-end}.tools span{display:none}.tools a,.tools .reset{margin:4px 0 0;padding:5px 8px}.tabs{padding:10px 12px;overflow:auto;gap:6px}.tab{padding:10px 11px;white-space:nowrap;font-size:10px}.tab .number{display:none}.footer{padding:8px 13px;font-size:8px}h1{font-size:15px;letter-spacing:1px}.wordmark{margin-right:5px}iframe{min-height:820px}}
</style></head><body><header><div><h1><span class="wordmark">白曜</span>透明互动实验室</h1><div class="caption">动画增强 V1.0 · 独立透明插件 · 完整设置</div></div><div class="tools"><span>检查底色</span><button class="swatch active" data-bg="dark" title="深色底" aria-label="深色底"></button><button class="swatch" data-bg="light" title="浅色底" aria-label="浅色底"></button><button class="swatch" data-bg="grid" title="透明棋盘格" aria-label="透明棋盘格"></button><button class="swatch" data-bg="live" title="直播背景模拟" aria-label="直播背景模拟"></button><button class="reset" id="restart">重新试玩</button><a id="standalone" href="plugins/快递分拣-试玩版.html" target="_blank">独立打开 ↗</a></div></header>
<nav class="tabs" aria-label="选择玩法"><button class="tab active" data-index="0"><span class="number">01</span>快递分拣</button><button class="tab" data-index="1"><span class="number">02</span>深夜异常便利店</button><button class="tab" data-index="2"><span class="number">03</span>魔女炼药锅</button><button class="tab" data-index="3"><span class="number">04</span>地下城救援队</button><button class="tab" data-index="4"><span class="number">05</span>危楼叠叠乐</button></nav>
<div class="view" id="view"><iframe id="game-frame" src="plugins/快递分拣-试玩版.html" title="快递分拣试玩"></iframe><div class="hint">背景只属于这个预览容器，插件文件本身为透明底。</div></div><footer class="footer"><span>左下完整设置：难度 / 外观 / 礼物规则 / 存档 · 快捷互动面板可隐藏</span><span>已内置 SDK / 本机礼物接入 · 真实直播待现场联调</span></footer>
<script>const files=['快递分拣-试玩版.html','深夜异常便利店-试玩版.html','魔女炼药锅-试玩版.html','观众地下城救援队-试玩版.html','危楼叠叠乐-试玩版.html'];let current=0;const frame=document.getElementById('game-frame');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{current=Number(b.dataset.index);document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));frame.src='plugins/'+files[current];frame.title=b.textContent.replace(/^\d+\s*/,'')+'试玩';document.getElementById('standalone').href=frame.src;});document.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>{document.getElementById('view').className='view '+b.dataset.bg;document.querySelectorAll('[data-bg]').forEach(x=>x.classList.toggle('active',x===b));});document.getElementById('restart').onclick=()=>{frame.src='plugins/'+files[current];};</script></body></html>

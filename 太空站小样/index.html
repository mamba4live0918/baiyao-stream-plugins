<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>白曜轨道站 · 实时渲染小样</title>
    <style>
      html,
      body {
        margin: 0;
        background: #04060b;
        color: #e8f1ff;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: none;
      }
      #gl {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #scroll-space {
        position: relative;
        pointer-events: none;
      }
      #loader {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 14px;
        background: #04060b;
        font: 500 12px/1.4 'Cascadia Mono', Consolas, monospace;
        letter-spacing: 0.24em;
        text-align: center;
        z-index: 2;
        transition: opacity 0.9s ease;
      }
      #loader .code {
        color: #ffb15c;
      }
      #loader .bar {
        width: 220px;
        height: 1px;
        background: rgba(141, 162, 191, 0.3);
      }
      #loader .bar i {
        display: block;
        height: 100%;
        width: 0;
        background: #ffb15c;
        transition: width 0.25s ease;
      }
      #loader.error .bar {
        display: none;
      }
      #loader.done {
        opacity: 0;
        pointer-events: none;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <canvas id="gl" aria-hidden="true"></canvas>
    <div id="loader" role="status" aria-live="polite">
      <span class="code">BAIYAO ORBITAL</span>
      <span id="loader-text">LOADING 0%</span>
      <div class="bar"><i id="loader-bar"></i></div>
    </div>
    <main class="sr-only" id="sr-copy"></main>
    <div id="scroll-space"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

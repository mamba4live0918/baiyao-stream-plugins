<header class="topbar"><div class="brand"><span class="brand-star">✧</span><h1>星幕塔罗</h1><span class="tagline">让每个问题，都被温柔照亮</span></div><nav aria-label="工具"><button data-action="spreads">牌阵</button><button data-action="library">牌库</button><button data-action="history">记录</button><button data-action="settings">设置</button><button class="outline" data-action="live">▣ 直播展示</button></nav></header>
<div id="storage-warning" role="alert" hidden></div>
<section id="hud" aria-label="排队信息"><button id="hud-grip" aria-label="拖动 HUD" title="直播模式下拖动 HUD">⠿</button><div class="hud-current"><span class="hud-label">当前</span><div><strong id="current-name">等待开桌</strong><p id="current-question">从等候名单开始，或开启一次自由占卜</p></div></div><div class="hud-next"><span class="hud-label">下一位</span><div><strong id="next-name">虚位以待</strong><p id="next-question">加入队列，等待星光落在你的牌上</p></div></div><div class="hud-count">等待 <strong id="queue-count">00</strong> 位</div></section>
<main class="workspace"><section class="table-shell" aria-label="塔罗牌桌"><div id="steps" class="steps"></div><div class="table-heading"><span class="heading-line"></span><div><h2 id="spread-title">今夜，为你展开</h2><p id="spread-subtitle">洗去喧嚣，让问题慢慢清晰</p></div><span class="heading-line"></span></div>
<div class="table-scroll"><div id="table" class="table"><div class="cloth-ring ring-one"></div><div class="cloth-ring ring-two"></div><div class="cloth-cross"></div><div id="cards" class="cards"></div></div></div>
<div id="deck-area" class="deck-area"></div><div id="flow-controls" class="flow-controls"></div></section>
<aside class="sidebar"><div class="side-heading"><h2>等候名单</h2><button class="outline small" data-action="focus-add">＋ 手动添加</button></div><div id="current-tools" class="current-tools" hidden></div><div id="queue-list" class="queue-list"></div>
<form id="add-form" class="add-form"><label>昵称<input id="add-name" name="name" required maxlength="40" placeholder="输入观众昵称" autocomplete="off"></label><label>主题<select id="add-topic" name="topic" aria-label="主题"></select></label><label>算什么<textarea id="add-question" name="question" maxlength="300" rows="2" placeholder="写下想探索的问题，也可以稍后补充"></textarea></label><button class="primary" type="submit">＋ 加入队列</button></form></aside></main>
<footer class="footer"><span id="deck-status">78 张牌 · 正逆位开启</span><span id="connection-status">准备连接</span><span>在星光之下，看见更清晰的自己</span></footer>
<button id="exit-live" data-action="live" hidden>退出展示 · Esc</button><button id="live-controls-toggle" data-action="live-controls" hidden>主持控制</button><div id="toast" role="status" aria-live="polite"></div>
<dialog id="modal"><div class="modal-header"><h2 id="modal-title"></h2><button data-action="close-modal" aria-label="关闭窗口">✕</button></div><div id="modal-body"></div></dialog>

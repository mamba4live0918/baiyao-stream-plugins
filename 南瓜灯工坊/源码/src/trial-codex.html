<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>南瓜灯工坊 · 试玩</title><style>
*{box-sizing:border-box}body{margin:0;height:100vh;display:grid;grid-template-columns:280px 1fr;font:14px "Microsoft YaHei",sans-serif;color:#513c4d;background:#ece6dc}aside{padding:28px 20px;overflow:auto;background:#fff5df;border-right:2px solid #6f4b59}h1{margin:0;font-size:27px}p{font-size:13px;line-height:1.9;color:#887061}button,select{font:inherit;border:2px solid #775260;border-radius:10px;padding:10px;color:#513b4c;background:#fffaf0;cursor:pointer}button{width:100%;margin:6px 0}button:hover{background:#ffe1aa}.primary{background:#ffbe68;font-weight:bold}h2{font-size:15px;margin-top:26px}small{display:block;margin-top:20px;color:#927b6f;line-height:1.8}main{min-width:0;display:grid;grid-template-rows:55px 1fr}nav{display:flex;align-items:center;justify-content:space-between;padding:8px 18px;background:#fff5e6;gap:16px;font-size:12px}#scene{position:relative;min-height:0;overflow:hidden;background:repeating-conic-gradient(#dedcd7 0% 25%,#eae8e0 0% 50%) 0/32px 32px}#scene.live{background:#302938}#avatar{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:82%;height:auto;pointer-events:none}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}#result{font-size:12px;padding-top:14px;color:#8d6748}@media(max-width:700px){body{grid-template-columns:165px 1fr}aside{padding:18px 10px}h1{font-size:20px}p{font-size:11px}nav{padding:6px;font-size:10px}button{font-size:12px}}
</style></head><body><aside><h1>南瓜灯工坊</h1><p>订一颗南瓜，跟着亮圈做一盏灯。</p><button id="order" class="primary">模拟弹幕订南瓜</button><button id="fifty">一键来 50 个</button><button id="flood">满屏来 500 个</button><button id="giant">巨型南瓜</button><button id="tower">地上堆 12 盏灯</button><button id="pickup">叫车收灯</button><button id="tower-one">再加一盏灯</button><button id="settings">打开设置</button><h2>捣乱与帮手</h2><button id="effect-rain">南瓜雨</button><button id="effect-rat">小老鼠</button><button id="effect-cat">黑猫</button><button id="effect-witch">女巫</button><button id="effect-ghost">小鬼</button><button id="effect-wind">妖风</button><button id="effect-goo">烂南瓜</button><button id="effect-sprite">南瓜精灵帮 3 件</button><button id="effect-jar">玻璃罩挡 2 下</button><h2>四步做一盏</h2><p>① 按住整个盖子向上提。<br>② 按住口沿，来回搅 1.2 秒。<br>③ 拖模具到南瓜上，或按住画。<br>④ 拖点火棒的火苗到南瓜口。<br>点亮后 0.8 秒落到成品灯堆。<br>每 30 秒小车来收灯。<br>也可随时点「叫车」。</p><small>圈起来挖掉一块，没闭合就是细缝。<br>没有撤销，刻歪也能点亮。<br>巨型挖瓤时间加倍。<br>堆里的南瓜拖到工作台，可换着刻。<br>刷新以后会接着玩。</small><div id="result">离线试玩准备中</div></aside><main><nav><span>透明叠加预览 · 白曜立绘</span><label><input id="live" type="checkbox"> 看直播时的样子</label><select id="size" aria-label="预览尺寸"><option value="">适合窗口</option><option>2048×1536</option><option>1920×1080</option><option>1080×1920</option><option>2560×1080</option><option>720×1280</option><option>480×854</option></select></nav><div id="scene"><img id="avatar" src="__AVATAR__" alt=""><iframe id="preview" title="南瓜灯工坊透明页"></iframe></div></main><script>
const frame=document.querySelector('#preview'),embeddedHtml=__EMBEDDED_HTML__;
function send(action,extra={}){try{frame.contentWindow.pumpkinDemo?.unlockAudio?.();}catch{}frame.contentWindow.postMessage({channel:'pumpkin-trial-v1',action,...extra},'*');}
function syncViewMode(){const live=document.querySelector('#live').checked;document.querySelector('#scene').classList.toggle('live',live);send('viewMode',{live});}
for(const id of ['order','fifty','flood','giant','settings','pickup'])document.getElementById(id).onclick=()=>send(id);
for(const kind of ["rain", "rat", "cat", "witch", "ghost", "wind", "goo", "sprite", "jar"])document.querySelector('#effect-'+kind).onclick=()=>send('effect',{kind,count:kind==='sprite'?3:kind==='jar'?2:1});
document.querySelector('#tower').onclick=()=>send('tower',{count:12});document.querySelector('#tower-one').onclick=()=>send('tower',{count:1});
document.querySelector('#live').onchange=syncViewMode;
document.querySelector('#size').onchange=()=>fit();
function fit(){const f=document.querySelector('#preview'),scene=document.querySelector('#scene'),value=document.querySelector('#size').value;let w=scene.clientWidth,h=scene.clientHeight,scale=1;if(!value)f.style.cssText='';else{[w,h]=value.split('×').map(Number);scale=Math.min(scene.clientWidth/w,scene.clientHeight/h);f.style.cssText='width:'+w+'px;height:'+h+'px;transform:scale('+scale+');transform-origin:top left;left:50%;margin-left:'+(-w*scale/2)+'px;';}const S=Math.min(w,h)*scale,avatar=document.querySelector('#avatar');avatar.style.width=S*1.4+'px';avatar.style.left='calc(50% + '+S*.054+'px)';avatar.style.bottom=scene.clientHeight-h*scale+'px';}
addEventListener('resize',fit);fit();frame.onload=()=>{document.querySelector('#result').textContent='准备好了，点“模拟弹幕订南瓜”开始';syncViewMode();};frame.srcdoc=embeddedHtml.replace('<html ','<html data-trial="true" ');
</script></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>南瓜灯工坊</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:#4a2a18;user-select:none;-webkit-user-select:none}
button,input,select{font:inherit}button{cursor:pointer}
#stage{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#topbar{position:fixed;left:50%;top:14px;transform:translateX(-50%);display:flex;gap:10px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
#topbar.visible,#topbar:hover,#topbar:focus-within{opacity:1;pointer-events:auto}
#topbar button{border:2px solid #6e3a1c;border-radius:14px;background:#fff1d8;padding:8px 16px;color:#5a2a12;font-weight:800;box-shadow:0 3px 0 #6e3a1c}
#topbar button:hover{background:#ffe0a8}#topbar button:active{transform:translateY(2px);box-shadow:0 1px 0 #6e3a1c}
#editbar{position:fixed;left:50%;bottom:4vmin;transform:translateX(-50%);z-index:30;display:none;align-items:center;gap:12px;padding:10px 14px 10px 20px;border-radius:16px;background:#3a1e0c;color:#fff1d8;font-weight:800;font-size:clamp(13px,1.8vmin,22px);box-shadow:0 6px 0 rgba(0,0,0,.3)}
body.editing #editbar{display:flex}body.editing #topbar{display:none}
#editbar button{border:2px solid #fff1d8;border-radius:12px;background:transparent;color:#fff1d8;padding:6px 14px;font-weight:800}#editbar button.primary{background:#ffbe68;color:#3a1e0c;border-color:#ffbe68}
#toast{position:fixed;left:50%;top:27vmin;transform:translate(-50%,-12px) scale(.96);padding:.55em 1.3em;border-radius:999px;background:#fff1d8;color:#5a2a12;border:3px solid #6e3a1c;box-shadow:0 4px 0 rgba(74,36,16,.55);font-weight:900;font-size:clamp(14px,2.6vmin,40px);white-space:nowrap;z-index:15;pointer-events:none;opacity:0;transition:opacity .18s,transform .25s cubic-bezier(.2,1.6,.4,1)}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
#toast.mess{background:#3d2a52;color:#fff1d8;border-color:#1f1230}#toast.mess.witch{background:#5a2a6e}#toast.mess.cat{background:#2d2a35}#toast.mess.ghost{background:#4a4f7a}#toast.mess.wind{background:#2f5a5a}
#settings{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(30,15,8,.45)}
#settings.open{display:flex}
.sheet{width:min(720px,94vw);max-height:92vh;overflow:auto;background:#fff7e8;border:3px solid #6e3a1c;border-radius:20px;padding:18px 22px;box-shadow:0 8px 0 rgba(74,36,16,.45);user-select:text}
.sheet h2{margin:0 0 10px;font-size:22px}.sheet h3{margin:14px 0 6px;font-size:18px}.sheet h4{margin:12px 0 6px;font-size:14px;color:#8a5a3a}
.sheet section{border-top:2px dashed #e8c79a;padding-top:6px}
.line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0;font-size:14px}
.line input:not([type]),.line input[type=text]{flex:1;min-width:200px}
input,select{border:2px solid #c99a6a;border-radius:9px;padding:5px 8px;background:#fffdf7;color:#4a2a18}
input.num{width:70px}input.gift{flex:1;min-width:140px}
.row{display:flex;align-items:center;gap:6px;margin:5px 0;font-size:14px}
.tip,.empty{font-size:13px;color:#8a6a4a;line-height:1.8;margin:6px 0}
.pool{display:grid;grid-template-columns:1fr 1fr;gap:8px}.molds{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:flex-start;gap:6px;border:2px solid #e3c08f;border-radius:12px;padding:8px;background:#fffdf5;font-size:14px;cursor:pointer}
.chip small{display:block;color:#8a6a4a;font-size:12px;margin-top:2px}.chip.small{padding:4px 8px}
.chip:has(input:checked){border-color:#e8792b;background:#fff0d6}
.sheet button{border:2px solid #6e3a1c;border-radius:11px;background:#fff1d8;padding:6px 14px;color:#5a2a12;font-weight:800}
.sheet button:hover{background:#ffe0a8}.sheet .del{padding:2px 9px}.sheet .primary{background:#ffbe68}.sheet .danger{background:#ffd9cf;margin-top:8px}
details{border-top:2px dashed #e8c79a;margin-top:12px;padding-top:8px}summary{cursor:pointer;font-weight:800;font-size:16px}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
</style></head><body><canvas id="stage" aria-label="南瓜灯工坊"></canvas><div id="toast" role="status"></div><nav id="topbar"><button id="btn-settings">⚙ 设置</button><button id="btn-layout">✥ 摆位置</button><button id="btn-try">🎃 试做一个</button></nav><div id="editbar">摆位置：拖框里挪位置，拖右下角的圆点改大小<button id="edit-reset">恢复默认</button><button id="edit-done" class="primary">完成</button></div><div id="settings"></div><script>__INLINE_BUNDLE__</script></body></html>

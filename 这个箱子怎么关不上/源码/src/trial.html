<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>这个箱子怎么关不上 · 试玩</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font:14px "Microsoft YaHei",system-ui,sans-serif;color:#4d4036;background:#dcd2df}#scene{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 15%,#d1dded,#b5bdd8 48%,#dfc6d6)}#box{position:absolute;left:50%;top:50%;transform-origin:center}#avatar{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:90%;width:auto;pointer-events:none}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}
#panel{position:fixed;left:16px;top:16px;z-index:10;width:285px;max-height:calc(100vh - 32px);overflow:auto;border:1px solid #ae9989;border-radius:18px;background:#fff9edee;box-shadow:0 8px 30px #38271f26;backdrop-filter:blur(12px)}#panel summary{padding:12px 16px;cursor:pointer;font-weight:700;list-style:none}#panel summary:after{content:'＋';float:right;font-size:18px}#panel[open] summary:after{content:'−'}#controls{padding:0 14px 15px}p{font-size:12px;color:#847365;line-height:1.8;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}button,select{font:inherit;cursor:pointer;border:1px solid #bea78f;border-radius:10px;background:#fffef8;padding:9px 6px;color:#584438}button:hover{background:#f9e6bf}.wide{grid-column:1/-1}.accent{background:#d8eee5;border-color:#91bbaa}h2{font-size:12px;color:#8b7765;margin:15px 0 7px}#live-toggle{position:fixed;right:16px;top:16px;z-index:11;border-radius:22px;padding:9px 15px;background:#fff9ede6;font-size:12px}body.live #panel{display:none}#hint{position:fixed;left:50%;top:20px;transform:translateX(-50%);background:#fff8e5c9;padding:10px 18px;border-radius:30px;font-size:12px;pointer-events:none;color:#6d5b4b;transition:opacity .4s}body.live #hint{opacity:0}@media(max-width:650px){#hint{top:66px;white-space:nowrap;font-size:11px}#panel{width:255px}}
</style></head><body><main id="scene"><div id="box"><img id="avatar" src="__AVATAR__" alt="试玩位置参考"><iframe id="frame" title="这个箱子怎么关不上"></iframe></div></main><div id="hint">拖行李进箱 → 按住盖子 → 松手 → 抢着拉拉链</div><button id="live-toggle">看直播时的样子</button><details id="panel"><summary>🧳 试玩小面板</summary><div id="controls"><p>第 1 步：试手感和素材。按住物件的一头，它会垂下来；抓中间，它更容易平着放。</p><h2>送到待装区</h2><div class="grid"><button data-kind="pillow">抱枕</button><button data-kind="jacket">羽绒服</button><button data-kind="bread">法棍</button><button data-kind="pan">平底锅</button><button data-kind="bear">玩偶熊</button><button data-kind="cat">猫</button><button data-do="batch" class="wide">再来 10 件</button></div><h2>局部手感演示</h2><div class="grid"><button data-do="helper">帮手按住</button><button data-do="strap">加一根绑带</button><button data-do="inflate">给软行李打气</button><button data-do="vacuum">抽一次真空</button><button data-do="wakeCat">叫醒猫</button><button data-do="practice" class="accent">压 → 松 → 拉练习</button></div><h2>画面和数值</h2><div class="grid"><button data-do="tuning">手感调节</button><button data-do="reset">重新开始</button><select id="size" class="wide"><option value="2048x1536">2048×1536 · 直播画布</option><option value="1920x1080">1920×1080</option><option value="1080x1920">1080×1920</option><option value="2560x1080">2560×1080</option><option value="720x1280">720×1280</option><option value="480x854">480×854</option><option value="">跟随窗口</option></select></div><p style="margin-top:12px">皮套只供试玩看位置，正式透明源只显示互动物件。</p></div></details><script>
const frame=document.getElementById('frame'),box=document.getElementById('box'),scene=document.getElementById('scene');frame.srcdoc=__EMBEDDED_HTML__;
const api=()=>frame.contentWindow?.luggageDemo;
document.getElementById('controls').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=api();if(!a?.state().ready)return;if(b.dataset.kind)a.sim.add(b.dataset.kind);else if(b.dataset.do==='tuning')a.openTuning();else a.sim[b.dataset.do]?.();});
document.getElementById('live-toggle').onclick=()=>{document.body.classList.toggle('live');document.getElementById('live-toggle').textContent=document.body.classList.contains('live')?'打开试玩面板':'看直播时的样子';};
function fit(){const v=document.getElementById('size').value,W=scene.clientWidth,H=scene.clientHeight,[w,h]=v?v.split('x').map(Number):[W,H],k=Math.min(W/w,H/h);box.style.width=w+'px';box.style.height=h+'px';box.style.transform=`translate(${-w/2}px,${-h/2}px) scale(${k})`;box.style.transformOrigin=`${w/2}px ${h/2}px`;document.getElementById('avatar').style.height=(Math.min(w,h)*.94)+'px';}
document.getElementById('size').onchange=fit;addEventListener('resize',fit);fit();
</script></body></html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>万圣节砸砸乐 · 试玩</title>
<style>
:root {
  --bg: #15111c;
  --panel: #211a2c;
  --ink: #f4ecff;
  --muted: #b3a5c8;
  --line: rgba(200, 180, 240, 0.16);
  --orange: #ff8a1f;
  --orange-ink: #2a1300;
  --mint: #7fe0c2;
  --pink: #ff8fb8;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  line-height: 1.6;
  user-select: none;
  -webkit-user-select: none;
}
.top, .wrap { max-width: 1320px; margin: 0 auto; padding: 0 24px; }
.top { padding-top: 26px; padding-bottom: 10px; }
.eyebrow { margin: 0 0 4px; color: var(--orange); font-size: 12px; letter-spacing: 0.16em; }
h1 { margin: 0 0 6px; font-size: 30px; letter-spacing: 0.04em; }
.lead { margin: 0; color: var(--muted); max-width: 980px; }
.stage-box { border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: #000; }
#stage { display: block; width: 100%; aspect-ratio: 16 / 9; cursor: grab; touch-action: none; }
#stage:active { cursor: grabbing; }
.panel { margin-top: 14px; padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; display: grid; gap: 10px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.tag { font-size: 12px; padding: 3px 10px; border-radius: 999px; letter-spacing: 0.08em; min-width: 56px; text-align: center; }
.tag.trick { background: rgba(255, 138, 31, 0.18); color: #ffb26b; }
.tag.treat { background: rgba(255, 143, 184, 0.18); color: var(--pink); }
.tag.self { background: rgba(127, 224, 194, 0.16); color: var(--mint); }
.tag.pool { background: rgba(185, 155, 255, 0.18); color: #cbb6ff; }
button {
  appearance: none;
  font: inherit;
  font-size: 14px;
  color: var(--ink);
  background: #2d2440;
  border: 1px solid rgba(220, 200, 255, 0.22);
  border-radius: 10px;
  padding: 7px 14px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, transform 0.08s;
}
button:hover { background: #3a2f52; border-color: rgba(255, 180, 110, 0.6); }
button:active { transform: scale(0.97); }
button:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
button.accent { background: var(--orange); color: var(--orange-ink); border-color: var(--orange); font-weight: 700; }
button.accent:hover { background: #ffa04a; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); cursor: pointer; }
.check input { accent-color: var(--orange); width: 16px; height: 16px; }
.hint { font-size: 13px; color: var(--muted); }
.chips { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; padding: 4px 12px; border-radius: 999px; background: transparent; color: var(--muted); }
.chip[aria-pressed="true"] { background: rgba(255, 138, 31, 0.2); color: #ffd2a8; border-color: rgba(255, 160, 80, 0.55); }
.foot { color: var(--muted); font-size: 13px; padding: 10px 2px 30px; }
@media (max-width: 700px) {
  h1 { font-size: 24px; }
  .top, .wrap { padding: 0 12px; }
}

</style>
</head>
<body>
<header class="top">
  <p class="eyebrow">白曜重工 · 砸砸乐 · 万圣节限定试玩</p>
  <h1>不给糖就捣蛋</h1>
  <p class="lead">点下面的按钮当作观众送礼物。在画面上按住鼠标拖动，就是你在晃头：南瓜塔、绷带、头上的蝙蝠都会跟着晃。</p>
</header>
<main class="wrap">
  <div class="stage-box"><canvas id="stage" aria-label="直播画面预览"></canvas></div>
  <section class="panel" aria-label="试玩按钮">
    <div class="row">
      <span class="tag trick">捣蛋</span>
      <button type="button" data-trick="tower">南瓜叠叠乐</button>
      <button type="button" data-trick="flood">南瓜淹没</button>
      <button type="button" data-trick="ghost">小幽灵附身</button>
      <button type="button" data-trick="potion">变身药水</button>
      <button type="button" data-trick="mummy">木乃伊缠绕</button>
      <button type="button" data-trick="bats">蝙蝠倒挂</button>
      <button type="button" data-trick="random" class="accent">随机捣蛋</button>
      <label class="check"><input type="checkbox" id="combo"> 连送 5 次</label>
    </div>
    <div class="row">
      <span class="tag treat">保护</span>
      <button type="button" id="candy1">送 1 颗糖</button>
      <button type="button" id="candy5">送 5 颗糖</button>
      <button type="button" id="scare">大礼物：吓飞蝙蝠</button>
      <span class="hint">糖攒满 20 颗：所有捣蛋解除，再给 15 秒保护罩</span>
    </div>
    <div class="row">
      <span class="tag self">皮套</span>
      <span class="hint">在画面上按住拖动 = 晃头</span>
      <label class="check"><input type="checkbox" id="auto"> 自动轻轻晃</label>
      <button type="button" id="shake">使劲甩头</button>
      <button type="button" id="reset">全部清空</button>
      <label class="check"><input type="checkbox" id="mute"> 静音</label>
    </div>
    <div class="row">
      <span class="tag pool">随机池</span>
      <span class="hint">「随机捣蛋」只从亮着的里面抽：</span>
      <span id="pool" class="chips"></span>
    </div>
  </section>
  <p class="foot">画面里的南瓜、幽灵、药水、绷带、蝙蝠、糖果都是临时用代码画的，正式版换成 Codex 画的图。药水变身和附身在真插件里由 VTS 完成（缩放、倒立、染色、透明、飘起来），这里用立绘模拟。画面上的字只写观众昵称和发生了什么。</p>
</main>

<script>
/* core.js */
/* 万圣节砸砸乐试玩 · 公共工具
   舞台是 1600×900 的逻辑坐标（和直播画布 16:9 一致），所有效果都用这个坐标。 */
(function () {
  'use strict';
  const HW = (window.HW = window.HW || {});
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const seg = (t, a, b) => (b <= a ? (t >= b ? 1 : 0) : clamp((t - a) / (b - a), 0, 1));
  const ease = {
    outCubic: k => 1 - Math.pow(1 - k, 3),
    inCubic: k => k * k * k,
    inOutSine: k => -(Math.cos(Math.PI * k) - 1) / 2,
    outBack: k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); },
    outElastic: k => (k <= 0 ? 0 : k >= 1 ? 1 : Math.pow(2, -10 * k) * Math.sin((k * 10 - 0.75) * (TAU / 3)) + 1),
  };

  // 可重复的随机数：重置时回到同一个种子，方便对比
  let seed = 20261031;
  const rand = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  const reseed = s => { seed = s >>> 0; };
  const range = (a, b) => a + (b - a) * rand();
  const pick = list => list[Math.floor(rand() * list.length) % list.length];

  // 画一次、以后反复用的小图
  function sprite(w, h, paint) {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.ceil(w));
    c.height = Math.max(1, Math.ceil(h));
    paint(c.getContext('2d'), c.width, c.height);
    return c;
  }
  // 带描边的粗体字（舞台上的提示字都用它）
  function label(g, text, x, y, o = {}) {
    const size = o.size || 30;
    g.save();
    g.font = (o.weight || 800) + ' ' + size + 'px "Microsoft YaHei UI","Microsoft YaHei","PingFang SC",sans-serif';
    g.textAlign = o.align || 'left';
    g.textBaseline = 'middle';
    g.lineJoin = 'round';
    g.globalAlpha *= o.alpha ?? 1;
    g.lineWidth = o.strokeW ?? size * 0.22;
    g.strokeStyle = o.stroke || 'rgba(32,20,48,.92)';
    g.strokeText(text, x, y);
    g.fillStyle = o.fill || '#FFF6E8';
    g.fillText(text, x, y);
    g.restore();
  }
  // 两点之间的抛物线位置（u 从 0 到 1，arc 是中点抬高多少）
  function arcPoint(a, b, u, arc) {
    return { x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u) - Math.sin(Math.PI * u) * arc };
  }

  HW.W = 1600;
  HW.H = 900;
  HW.util = { TAU, clamp, lerp, seg, ease, rand, reseed, range, pick, sprite, label, arcPoint };
  HW.names = ['小白兔', '奶油泡芙', '月亮不睡', '橘子汽水', '小熊软糖', '夜猫子', '南瓜派', '咕噜咕噜', '棉花糖', '星星眼', '布丁', '小鱼干'];
})();

/* sound.js */
/* 万圣节砸砸乐试玩 · 音效（全部用 WebAudio 现合成，不带音频文件）
   第一次点按钮时才创建声音设备（浏览器要求用户先操作）。 */
(function () {
  'use strict';
  const HW = window.HW;
  let ctx = null, master = null, noiseBuf = null, muted = false;

  function ready() {
    if (muted) return null;
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.5;
      const comp = ctx.createDynamicsCompressor();
      master.connect(comp);
      comp.connect(ctx.destination);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function env(gain, t, attack, hold, release, peak) {
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(peak, t + attack);
    gain.gain.setValueAtTime(peak, t + attack + hold);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + attack + hold + release);
  }
  // 一个音：波形、起止频率、时长、音量
  function tone(type, f0, f1, dur, vol, delay = 0, vibrato = 0) {
    const c = ready(); if (!c) return;
    const t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    if (vibrato) {
      const lfo = c.createOscillator(), lg = c.createGain();
      lfo.frequency.value = 6.5; lg.gain.value = vibrato;
      lfo.connect(lg); lg.connect(o.frequency); lfo.start(t); lfo.stop(t + dur + 0.05);
    }
    env(g, t, 0.008, dur * 0.25, dur * 0.75, vol);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  }
  // 一段噪声：滤波类型、起止中心频率、时长、音量
  function noise(type, f0, f1, dur, vol, delay = 0, q = 1) {
    const c = ready(); if (!c) return;
    const t = c.currentTime + delay, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = noiseBuf;
    f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t);
    f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    env(g, t, 0.004, dur * 0.15, dur * 0.85, vol);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  }

  HW.sfx = {
    setMuted(v) { muted = !!v; if (muted && ctx) ctx.suspend(); else if (ctx) ctx.resume(); },
    get muted() { return muted; },
    unlock() { ready(); },
    thud() { tone('sine', 140, 55, 0.22, 0.55); noise('lowpass', 900, 200, 0.09, 0.25); },
    crash() { noise('bandpass', 1400, 300, 0.45, 0.5, 0, 0.8); tone('sine', 110, 40, 0.3, 0.5); },
    pop() { tone('sine', 520, 980, 0.09, 0.35); },
    boo() { tone('sine', 330, 170, 0.9, 0.3, 0, 9); tone('triangle', 495, 255, 0.9, 0.12, 0.02, 9); noise('lowpass', 700, 300, 0.7, 0.08); },
    whoosh() { noise('bandpass', 260, 2400, 0.6, 0.35, 0, 1.4); },
    possess() { tone('sine', 220, 110, 1.4, 0.22, 0, 5); tone('sine', 277, 139, 1.4, 0.16, 0.05, 5); tone('sine', 330, 165, 1.4, 0.14, 0.1, 5); noise('bandpass', 400, 3000, 1.0, 0.18, 0, 2); },
    glass() { noise('highpass', 3200, 5200, 0.25, 0.4); [2600, 3400, 4100].forEach((f, i) => tone('sine', f, f * 0.97, 0.3, 0.12, i * 0.03)); noise('lowpass', 1200, 300, 0.3, 0.3, 0.02); },
    boing() { tone('sine', 220, 660, 0.18, 0.35, 0, 0); tone('sine', 660, 330, 0.3, 0.3, 0.18, 30); },
    poof() { noise('lowpass', 1200, 200, 0.4, 0.45); tone('sine', 300, 120, 0.25, 0.15); },
    swish() { noise('bandpass', 900, 2600, 0.22, 0.32, 0, 2); },
    wrap() { noise('bandpass', 2400, 900, 0.3, 0.22, 0, 3); },
    flap() { for (let i = 0; i < 3; i++) noise('bandpass', 700, 500, 0.05, 0.25, i * 0.07, 2); },
    squeak() { tone('sine', 2300, 3100, 0.07, 0.18); tone('sine', 2500, 3400, 0.07, 0.15, 0.1); },
    chomp() { noise('lowpass', 2200, 600, 0.06, 0.35); noise('lowpass', 2000, 500, 0.06, 0.3, 0.12); },
    coin() { tone('triangle', 988, 988, 0.08, 0.22); tone('triangle', 1319, 1319, 0.14, 0.22, 0.07); },
    jingle() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone('triangle', f, f, 0.18, 0.22, i * 0.08)); },
    shield() { [523, 659, 784].forEach((f, i) => tone('sine', f, f * 1.01, 1.2, 0.12, i * 0.04, 4)); },
    bubble() { tone('sine', 400 + Math.random() * 300, 900 + Math.random() * 300, 0.08, 0.12); },
  };
})();

/* art.js */
/* 万圣节砸砸乐试玩 · 占位素材（代码画的，正式版换成 Codex 画的图）
   每种素材画一次存成小图，播放时只是贴图，省 GPU。 */
(function () {
  'use strict';
  const HW = window.HW;
  const { TAU, sprite } = HW.util;
  const OUT = 'rgba(70,32,12,.9)';

  function ellipse(g, x, y, rx, ry) { g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, TAU); }

  // ---------- 南瓜灯：三种表情 ----------
  function pumpkin(face) {
    return sprite(220, 180, (g, W, H) => {
      const cx = W / 2, cy = H * 0.56, rx = W * 0.42, ry = H * 0.36;
      const rib = (dx, w, h, light) => {
        const gr = g.createRadialGradient(cx + dx - w * 0.3, cy - h * 0.35, 4, cx + dx, cy, Math.max(w, h) * 1.1);
        gr.addColorStop(0, light ? '#FFC46B' : '#FFB04A');
        gr.addColorStop(0.55, '#F58A22');
        gr.addColorStop(1, '#C0581A');
        g.fillStyle = gr;
        ellipse(g, cx + dx, cy, w, h);
        g.fill();
        g.lineWidth = 3;
        g.strokeStyle = OUT;
        g.stroke();
      };
      rib(-rx * 0.62, rx * 0.42, ry * 0.9);
      rib(rx * 0.62, rx * 0.42, ry * 0.9);
      rib(-rx * 0.3, rx * 0.46, ry * 0.97);
      rib(rx * 0.3, rx * 0.46, ry * 0.97);
      rib(0, rx * 0.44, ry, true);
      // 梗和小藤蔓
      g.fillStyle = '#5E7F32';
      g.strokeStyle = 'rgba(30,50,15,.9)';
      g.lineWidth = 2.5;
      g.beginPath();
      g.moveTo(cx - 9, cy - ry + 6);
      g.quadraticCurveTo(cx - 6, cy - ry - 22, cx + 10, cy - ry - 30);
      g.lineTo(cx + 15, cy - ry - 22);
      g.quadraticCurveTo(cx + 4, cy - ry - 14, cx + 8, cy - ry + 6);
      g.closePath();
      g.fill(); g.stroke();
      g.strokeStyle = '#6E9A3C';
      g.lineWidth = 3;
      g.beginPath();
      g.moveTo(cx + 6, cy - ry - 12);
      g.bezierCurveTo(cx + 34, cy - ry - 26, cx + 40, cy - ry + 2, cx + 26, cy - ry - 4);
      g.stroke();
      // 刻出来的脸：里面发光
      const glow = g.createRadialGradient(cx, cy + 4, 2, cx, cy + 4, rx * 0.8);
      glow.addColorStop(0, '#FFF3A8');
      glow.addColorStop(0.5, '#FFD045');
      glow.addColorStop(1, '#FF9418');
      g.fillStyle = glow;
      g.strokeStyle = 'rgba(110,40,6,.95)';
      g.lineWidth = 2.5;
      g.beginPath();
      if (face === 0) {
        // 三角眼 + 锯齿笑
        g.moveTo(cx - 52, cy - 6); g.lineTo(cx - 34, cy - 34); g.lineTo(cx - 16, cy - 6); g.closePath();
        g.moveTo(cx + 16, cy - 6); g.lineTo(cx + 34, cy - 34); g.lineTo(cx + 52, cy - 6); g.closePath();
        g.moveTo(cx - 60, cy + 16);
        g.quadraticCurveTo(cx, cy + 62, cx + 60, cy + 16);
        g.lineTo(cx + 40, cy + 22); g.lineTo(cx + 30, cy + 12); g.lineTo(cx + 18, cy + 26); g.lineTo(cx + 6, cy + 14);
        g.lineTo(cx - 6, cy + 26); g.lineTo(cx - 18, cy + 14); g.lineTo(cx - 30, cy + 26); g.lineTo(cx - 40, cy + 14);
        g.closePath();
      } else if (face === 1) {
        // 圆眼 + 弯弯笑（可爱）
        g.ellipse(cx - 32, cy - 16, 14, 17, 0, 0, TAU);
        g.moveTo(cx + 46, cy - 16);
        g.ellipse(cx + 32, cy - 16, 14, 17, 0, 0, TAU);
        g.moveTo(cx - 34, cy + 18);
        g.quadraticCurveTo(cx, cy + 50, cx + 34, cy + 18);
        g.quadraticCurveTo(cx, cy + 32, cx - 34, cy + 18);
      } else {
        // 吃惊：圆眼 + O 嘴
        g.ellipse(cx - 32, cy - 14, 15, 15, 0, 0, TAU);
        g.moveTo(cx + 47, cy - 14);
        g.ellipse(cx + 32, cy - 14, 15, 15, 0, 0, TAU);
        g.moveTo(cx + 16, cy + 30);
        g.ellipse(cx, cy + 30, 16, 20, 0, 0, TAU);
      }
      g.fill('evenodd');
      g.stroke();
      if (face === 1) {
        g.fillStyle = 'rgba(255,120,120,.55)';
        ellipse(g, cx - 58, cy + 14, 12, 7); g.fill();
        ellipse(g, cx + 58, cy + 14, 12, 7); g.fill();
      }
      // 高光
      g.fillStyle = 'rgba(255,255,255,.35)';
      ellipse(g, cx - rx * 0.55, cy - ry * 0.45, 10, 18);
      g.fill();
    });
  }

  // ---------- 小幽灵：三种表情 ----------
  function ghost(face) {
    return sprite(150, 170, (g, W, H) => {
      const cx = W / 2, top = 18, bottom = H - 18, r = W * 0.36;
      g.beginPath();
      g.moveTo(cx - r, top + r);
      g.arc(cx, top + r, r, Math.PI, 0);
      g.lineTo(cx + r, bottom - 16);
      const bumps = 4, step = (2 * r) / bumps;
      for (let i = 0; i < bumps; i++) {
        const x0 = cx + r - i * step;
        g.quadraticCurveTo(x0 - step * 0.25, bottom + 8, x0 - step * 0.5, bottom - 10);
        g.quadraticCurveTo(x0 - step * 0.75, bottom - 26, x0 - step, bottom - 12);
      }
      g.closePath();
      const gr = g.createRadialGradient(cx - r * 0.3, top + r * 0.6, 4, cx, top + r * 1.3, r * 1.9);
      gr.addColorStop(0, '#FFFFFF');
      gr.addColorStop(0.7, '#F1EEFF');
      gr.addColorStop(1, '#D7D0F5');
      g.fillStyle = gr;
      g.fill();
      g.lineWidth = 3;
      g.strokeStyle = 'rgba(120,105,180,.85)';
      g.stroke();
      // 小手
      g.fillStyle = '#F4F1FF';
      ellipse(g, cx - r - 6, top + r * 1.55, 12, 9); g.fill(); g.stroke();
      ellipse(g, cx + r + 6, top + r * 1.45, 12, 9); g.fill(); g.stroke();
      // 眼睛
      const ey = top + r * 0.95;
      g.fillStyle = '#2B2340';
      ellipse(g, cx - 17, ey, 8, 11); g.fill();
      ellipse(g, cx + 17, ey, 8, 11); g.fill();
      g.fillStyle = '#FFFFFF';
      ellipse(g, cx - 14, ey - 4, 3, 3.5); g.fill();
      ellipse(g, cx + 20, ey - 4, 3, 3.5); g.fill();
      g.fillStyle = 'rgba(255,130,170,.6)';
      ellipse(g, cx - 32, ey + 14, 9, 5); g.fill();
      ellipse(g, cx + 32, ey + 14, 9, 5); g.fill();
      g.fillStyle = '#2B2340';
      g.strokeStyle = '#2B2340';
      g.lineWidth = 3;
      g.lineCap = 'round';
      if (face === 0) { g.beginPath(); g.arc(cx, ey + 12, 8, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke(); }
      else if (face === 1) { ellipse(g, cx, ey + 20, 7, 9); g.fill(); }
      else {
        g.beginPath(); g.arc(cx, ey + 12, 8, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke();
        g.fillStyle = '#FF7FA8'; ellipse(g, cx + 3, ey + 22, 5, 6); g.fill();
      }
    });
  }

  // ---------- 药水瓶：颜色就是效果 ----------
  const POTIONS = {
    shrink: { color: '#A970FF', dark: '#6B3FC4', name: '缩小' },
    grow: { color: '#FF5C8A', dark: '#C42E5C', name: '变大' },
    green: { color: '#6FDB4F', dark: '#3E9E27', name: '变绿' },
    flip: { color: '#4FB3FF', dark: '#2275C4', name: '倒立' },
    fade: { color: '#F2D9FF', dark: '#B98AD6', name: '隐身' },
  };
  function potion(key) {
    const p = POTIONS[key];
    return sprite(110, 150, (g, W) => {
      const cx = W / 2, by = 96, r = 40;
      // 瓶子玻璃
      g.beginPath();
      g.moveTo(cx - 13, 30); g.lineTo(cx - 13, by - r + 8);
      g.arc(cx, by, r, -Math.PI / 2 - 1.24, -Math.PI / 2 + 1.24 + TAU, false);
      g.lineTo(cx + 13, 30); g.closePath();
      g.fillStyle = 'rgba(210,240,255,.45)'; g.fill();
      // 药水
      g.save(); g.clip();
      const lg = g.createLinearGradient(0, by - 10, 0, by + r);
      lg.addColorStop(0, p.color); lg.addColorStop(1, p.dark);
      g.fillStyle = lg;
      g.beginPath();
      g.moveTo(cx - r - 4, by - 6);
      g.bezierCurveTo(cx - 16, by - 18, cx + 10, by + 4, cx + r + 4, by - 10);
      g.lineTo(cx + r + 4, by + r + 4); g.lineTo(cx - r - 4, by + r + 4); g.closePath();
      g.fill();
      g.fillStyle = 'rgba(255,255,255,.55)';
      for (const [x, y, s] of [[cx - 12, by + 14, 5], [cx + 8, by + 22, 3.5], [cx + 16, by + 6, 2.5]]) { ellipse(g, x, y, s, s); g.fill(); }
      g.restore();
      // 玻璃轮廓 + 高光
      g.lineWidth = 3.5; g.strokeStyle = 'rgba(40,40,80,.85)';
      g.beginPath();
      g.moveTo(cx - 13, 30); g.lineTo(cx - 13, by - r + 8);
      g.arc(cx, by, r, -Math.PI / 2 - 1.24, -Math.PI / 2 + 1.24 + TAU, false);
      g.lineTo(cx + 13, 30); g.stroke();
      g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 4; g.lineCap = 'round';
      g.beginPath(); g.arc(cx, by, r - 9, Math.PI * 1.05, Math.PI * 1.35); g.stroke();
      // 软木塞
      g.fillStyle = '#B07A4E'; g.strokeStyle = 'rgba(70,40,20,.9)'; g.lineWidth = 2.5;
      g.beginPath(); g.roundRect(cx - 16, 14, 32, 20, 6); g.fill(); g.stroke();
      // 瓶身小符号（不写字）
      g.strokeStyle = '#FFFFFF'; g.fillStyle = '#FFFFFF'; g.lineWidth = 4;
      const sy = by + 4;
      g.beginPath();
      if (key === 'shrink') { g.moveTo(cx, sy - 14); g.lineTo(cx, sy + 12); g.moveTo(cx - 10, sy + 2); g.lineTo(cx, sy + 12); g.lineTo(cx + 10, sy + 2); }
      else if (key === 'grow') { g.moveTo(cx, sy + 14); g.lineTo(cx, sy - 12); g.moveTo(cx - 10, sy - 2); g.lineTo(cx, sy - 12); g.lineTo(cx + 10, sy - 2); }
      else if (key === 'green') { g.ellipse(cx, sy, 9, 14, 0.6, 0, TAU); }
      else if (key === 'flip') { g.arc(cx, sy, 11, -0.3, Math.PI * 1.4); g.moveTo(cx + 11, sy - 12); g.lineTo(cx + 12, sy - 2); g.lineTo(cx + 2, sy - 3); }
      else { for (let i = 0; i < 4; i++) { const a = (i * Math.PI) / 2; g.moveTo(cx, sy); g.lineTo(cx + Math.cos(a) * 13, sy + Math.sin(a) * 13); } }
      g.stroke();
    });
  }

  // ---------- 绷带条 ----------
  function bandage(v) {
    return sprite(460, 64, (g, W, H) => {
      const pad = 6;
      g.beginPath();
      g.moveTo(pad + 10, pad);
      for (let x = pad + 10; x < W - pad - 10; x += 20) g.lineTo(x + 10, pad + (v === 1 ? 2 : 0) + ((x / 20) % 2) * 2);
      g.lineTo(W - pad, pad + 4);
      for (let y = pad + 4; y < H - pad; y += 8) g.lineTo(W - pad - ((y / 8) % 2 ? 9 : 0), y + 8);
      for (let x = W - pad - 10; x > pad + 10; x -= 20) g.lineTo(x - 10, H - pad - ((x / 20) % 2) * 2);
      g.lineTo(pad, H - pad - 4);
      for (let y = H - pad - 4; y > pad; y -= 8) g.lineTo(pad + ((y / 8) % 2 ? 9 : 0), y - 8);
      g.closePath();
      const lg = g.createLinearGradient(0, 0, 0, H);
      lg.addColorStop(0, '#F8F1E2'); lg.addColorStop(0.5, '#EFE4CC'); lg.addColorStop(1, '#DDCFB0');
      g.fillStyle = lg;
      g.fill();
      g.save(); g.clip();
      g.strokeStyle = 'rgba(160,140,100,.35)'; g.lineWidth = 1.5;
      for (let x = -H; x < W + H; x += 14) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x + H, H); g.stroke(); }
      g.strokeStyle = 'rgba(140,120,80,.5)'; g.lineWidth = 2;
      g.beginPath(); g.moveTo(0, H * 0.3); g.lineTo(W, H * 0.33); g.moveTo(0, H * 0.7); g.lineTo(W, H * 0.68); g.stroke();
      g.fillStyle = 'rgba(150,120,80,.18)';
      for (let i = 0; i < 6; i++) { ellipse(g, 40 + ((i * 97 + v * 53) % (W - 80)), 18 + ((i * 31 + v * 17) % 30), 9, 5); g.fill(); }
      g.restore();
      g.strokeStyle = 'rgba(120,96,60,.7)'; g.lineWidth = 2; g.stroke();
    });
  }

  // ---------- 糖果 ----------
  const CANDY_COLORS = [['#FF8FB8', '#E0477F'], ['#7FE0C2', '#2FAE8A'], ['#FFD24A', '#E39A12'], ['#B99BFF', '#7B5BDE']];
  function candy(v) {
    return sprite(84, 56, (g, W, H) => {
      const cx = W / 2, cy = H / 2;
      g.lineWidth = 2.5; g.strokeStyle = 'rgba(60,30,50,.85)';
      if (v < 4) {
        const [c, d] = CANDY_COLORS[v];
        for (const s of [-1, 1]) {
          g.beginPath();
          g.moveTo(cx + s * 14, cy); g.lineTo(cx + s * 38, cy - 15); g.lineTo(cx + s * 33, cy); g.lineTo(cx + s * 38, cy + 15); g.closePath();
          g.fillStyle = d; g.fill(); g.stroke();
        }
        const rg = g.createRadialGradient(cx - 5, cy - 6, 2, cx, cy, 20);
        rg.addColorStop(0, '#FFFFFF'); rg.addColorStop(0.35, c); rg.addColorStop(1, d);
        g.fillStyle = rg; ellipse(g, cx, cy, 19, 17); g.fill(); g.stroke();
        if (v === 3) { g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = 3; g.beginPath(); g.arc(cx, cy, 10, 0.3, 2.4); g.stroke(); }
      } else if (v === 4) {
        // 糖果玉米（万圣节经典）：白尖、橙中、黄底
        g.save();
        g.beginPath(); g.moveTo(cx, cy - 24); g.quadraticCurveTo(cx + 22, cy + 18, cx + 18, cy + 22); g.quadraticCurveTo(cx, cy + 27, cx - 18, cy + 22); g.quadraticCurveTo(cx - 22, cy + 18, cx, cy - 24); g.closePath();
        g.clip();
        g.fillStyle = '#FFD24A'; g.fillRect(0, 0, W, H);
        g.fillStyle = '#FF8A1F'; g.fillRect(0, 0, W, cy + 10);
        g.fillStyle = '#FFF8EC'; g.fillRect(0, 0, W, cy - 6);
        g.restore();
        g.beginPath(); g.moveTo(cx, cy - 24); g.quadraticCurveTo(cx + 22, cy + 18, cx + 18, cy + 22); g.quadraticCurveTo(cx, cy + 27, cx - 18, cy + 22); g.quadraticCurveTo(cx - 22, cy + 18, cx, cy - 24); g.closePath();
        g.stroke();
      } else {
        // 棒棒糖
        g.fillStyle = '#F4E6D0'; g.fillRect(cx + 10, cy + 4, 26, 6); g.strokeRect(cx + 10, cy + 4, 26, 6);
        g.fillStyle = '#FFFFFF'; ellipse(g, cx - 6, cy - 2, 20, 20); g.fill();
        g.strokeStyle = '#FF5C8A'; g.lineWidth = 5;
        g.beginPath(); for (let a = 0; a < 12; a += 0.2) { const rr = a * 1.5; g.lineTo(cx - 6 + Math.cos(a) * rr, cy - 2 + Math.sin(a) * rr); } g.stroke();
        g.strokeStyle = 'rgba(60,30,50,.85)'; g.lineWidth = 2.5; ellipse(g, cx - 6, cy - 2, 20, 20); g.stroke();
      }
    });
  }

  // ---------- 南瓜糖果桶（后层：开口；前层：桶身） ----------
  function bucketBack() {
    return sprite(240, 220, (g, W) => {
      const cx = W / 2;
      g.fillStyle = '#5A2A0C';
      ellipse(g, cx, 66, 86, 22); g.fill();
    });
  }
  function bucketFront() {
    return sprite(240, 220, (g, W, H) => {
      const cx = W / 2, cy = 128;
      // 提手
      g.strokeStyle = '#3B2A3F'; g.lineWidth = 7; g.lineCap = 'round';
      g.beginPath(); g.moveTo(cx - 80, 70); g.bezierCurveTo(cx - 70, -6, cx + 70, -6, cx + 80, 70); g.stroke();
      // 桶身（下半个南瓜）
      g.save();
      g.beginPath(); g.rect(0, 64, W, H); g.clip();
      for (const [dx, w, h, light] of [[-56, 44, 74], [56, 44, 74], [-26, 50, 80], [26, 50, 80], [0, 48, 82, 1]]) {
        const gr = g.createRadialGradient(cx + dx - 14, cy - 30, 4, cx + dx, cy, 90);
        gr.addColorStop(0, light ? '#FFC46B' : '#FFB04A'); gr.addColorStop(0.55, '#F58A22'); gr.addColorStop(1, '#C0581A');
        g.fillStyle = gr; ellipse(g, cx + dx, cy, w, h); g.fill();
        g.lineWidth = 3; g.strokeStyle = OUT; g.stroke();
      }
      g.restore();
      // 桶口边
      g.lineWidth = 6; g.strokeStyle = '#D9701C';
      g.beginPath(); g.ellipse(cx, 66, 86, 22, 0, 0, Math.PI); g.stroke();
      g.lineWidth = 3; g.strokeStyle = OUT;
      g.beginPath(); g.ellipse(cx, 66, 89, 25, 0, 0, Math.PI); g.stroke();
      // 刻的笑脸
      const glow = g.createRadialGradient(cx, cy + 10, 2, cx, cy + 10, 70);
      glow.addColorStop(0, '#FFF3A8'); glow.addColorStop(0.5, '#FFD045'); glow.addColorStop(1, '#FF9418');
      g.fillStyle = glow; g.strokeStyle = 'rgba(110,40,6,.95)'; g.lineWidth = 2.5;
      g.beginPath();
      g.moveTo(cx - 44, cy + 2); g.lineTo(cx - 30, cy - 20); g.lineTo(cx - 16, cy + 2); g.closePath();
      g.moveTo(cx + 16, cy + 2); g.lineTo(cx + 30, cy - 20); g.lineTo(cx + 44, cy + 2); g.closePath();
      g.moveTo(cx - 46, cy + 20); g.quadraticCurveTo(cx, cy + 66, cx + 46, cy + 20);
      g.lineTo(cx + 30, cy + 26); g.lineTo(cx + 20, cy + 18); g.lineTo(cx + 8, cy + 30); g.lineTo(cx - 4, cy + 20); g.lineTo(cx - 16, cy + 30); g.lineTo(cx - 28, cy + 20);
      g.closePath();
      g.fill(); g.stroke();
    });
  }

  // ---------- 蝙蝠（每帧现画，翅膀会扇） ----------
  function drawBat(g, x, y, s, flap, hanging, rot = 0, alpha = 1) {
    g.save();
    g.translate(x, y);
    g.rotate(rot + (hanging ? Math.PI : 0));
    g.scale(s, s);
    g.globalAlpha *= alpha;
    g.lineJoin = 'round';
    const body = '#2A2238', edge = '#9C8CC8';
    if (!hanging) {
      const lift = Math.sin(flap);
      for (const side of [-1, 1]) {
        g.save();
        g.scale(side, 1);
        g.rotate(-0.25 - lift * 0.55);
        g.beginPath();
        g.moveTo(6, -6);
        g.quadraticCurveTo(30, -30, 62, -14);
        g.quadraticCurveTo(56, -2, 60, 8);
        g.quadraticCurveTo(48, 2, 42, 12);
        g.quadraticCurveTo(30, 4, 24, 14);
        g.quadraticCurveTo(16, 6, 6, 8);
        g.closePath();
        g.fillStyle = body; g.fill();
        g.lineWidth = 2.5; g.strokeStyle = edge; g.stroke();
        g.restore();
      }
    } else {
      // 收起的翅膀把身体包住
      g.fillStyle = body; g.strokeStyle = edge; g.lineWidth = 2.5;
      g.beginPath(); g.ellipse(-10, 4, 11, 22, 0.25, 0, TAU); g.fill(); g.stroke();
      g.beginPath(); g.ellipse(10, 4, 11, 22, -0.25, 0, TAU); g.fill(); g.stroke();
      // 爪子（倒挂时朝上，抓着东西）
      g.strokeStyle = edge; g.lineWidth = 2.5;
      g.beginPath(); g.moveTo(-5, 24); g.lineTo(-6, 32); g.moveTo(5, 24); g.lineTo(6, 32); g.stroke();
    }
    // 身体 + 头 + 耳朵
    g.fillStyle = body; g.strokeStyle = edge; g.lineWidth = 2.5;
    g.beginPath(); g.ellipse(0, 4, 13, 17, 0, 0, TAU); g.fill(); g.stroke();
    g.beginPath();
    g.moveTo(-12, -10); g.lineTo(-14, -30); g.lineTo(-3, -16);
    g.lineTo(3, -16); g.lineTo(14, -30); g.lineTo(12, -10);
    g.closePath(); g.fill(); g.stroke();
    g.beginPath(); g.arc(0, -8, 13, 0, TAU); g.fill(); g.stroke();
    // 大眼睛 + 小尖牙（可爱不吓人）
    g.fillStyle = '#FFFFFF';
    g.beginPath(); g.arc(-5, -9, 4.6, 0, TAU); g.arc(5, -9, 4.6, 0, TAU); g.fill();
    g.fillStyle = '#2B2340';
    g.beginPath(); g.arc(-4.4, -8.4, 2.4, 0, TAU); g.arc(5.6, -8.4, 2.4, 0, TAU); g.fill();
    g.fillStyle = '#FFFFFF';
    g.beginPath(); g.moveTo(-3.5, -1); g.lineTo(-2, 3); g.lineTo(-0.5, -1); g.moveTo(0.5, -1); g.lineTo(2, 3); g.lineTo(3.5, -1); g.fill();
    g.fillStyle = 'rgba(255,140,180,.6)';
    g.beginPath(); g.ellipse(-9, -3, 3, 2, 0, 0, TAU); g.ellipse(9, -3, 3, 2, 0, 0, TAU); g.fill();
    g.restore();
  }

  const A = (HW.art = {
    POTIONS,
    pumpkins: [], ghosts: [], potions: {}, bandages: [], candies: [],
    bucketBack: null, bucketFront: null,
    drawBat,
    init() {
      A.pumpkins = [0, 1, 2].map(pumpkin);
      A.ghosts = [0, 1, 2].map(ghost);
      for (const k of Object.keys(POTIONS)) A.potions[k] = potion(k);
      A.bandages = [0, 1, 2].map(bandage);
      A.candies = [0, 1, 2, 3, 4, 5].map(candy);
      A.bucketBack = bucketBack();
      A.bucketFront = bucketFront();
    },
  });
})();

/* avatar.js */
/* 万圣节砸砸乐试玩 · 皮套替身
   用白曜的立绘代替 VTS 模型。鼠标拖动 = 主播晃头（真实插件里来自 VTS 的头部跟随）。
   药水、附身这些效果在真插件里由 VTS 完成（移动 / 缩放 / 旋转 / 染色），这里用变换模拟。 */
(function () {
  'use strict';
  const HW = window.HW;
  const { clamp, sprite } = HW.util;

  // 立绘图片里的关键点（像素）
  const PIVOT = { x: 545, y: 520 };            // 头歪的时候绕着脖子转
  const POINTS = {
    headTop: { x: 543, y: 96 }, face: { x: 543, y: 330 }, mouth: { x: 541, y: 398 },
    eyeL: { x: 490, y: 313 }, eyeR: { x: 598, y: 313 }, earL: { x: 425, y: 78 }, earR: { x: 660, y: 78 },
    hairL: { x: 372, y: 236 }, hairR: { x: 728, y: 236 }, chest: { x: 545, y: 640 }, bottom: { x: 585, y: 900 }, center: { x: 585, y: 470 },
  };
  const FACE_HOLE = { x: 543, y: 300, rx: 210, ry: 235 };   // 「淹没」时一定露出来的脸（含头发）

  const A = (HW.avatar = {
    img: null, tints: {},
    stage: { x: 774, y: 649 }, baseScale: 0.66,
    // 头的晃动（弹簧跟着目标走）
    pos: { x: 0, y: 0 }, vel: { x: 0, y: 0 }, tilt: 0, tiltVel: 0,
    target: { x: 0, y: 0, tilt: 0 },
    acc: { x: 0, y: 0 }, angAcc: 0,
    // 效果叠加：缩放、翻转、上浮、透明、染色
    fx: { scale: 1, scaleAnchor: POINTS.bottom, flip: 0, lift: 0, sway: 0, alpha: 1, ghost: 0, green: 0, chomp: 0 },
    drag: null, auto: false, shakeT: -1, time: 0,
    matrix: null, POINTS, FACE_HOLE,

    init(img) {
      A.img = img;
      // 染色版本只做一次：淡蓝（附身）和绿色（药水）
      const tint = color => sprite(img.naturalWidth, img.naturalHeight, g => {
        g.drawImage(img, 0, 0);
        g.globalCompositeOperation = 'source-atop';
        g.fillStyle = color;
        g.fillRect(0, 0, img.naturalWidth, img.naturalHeight);
      });
      A.tints.ghost = tint('rgba(150,205,255,.62)');
      A.tints.green = tint('rgba(110,220,80,.58)');
      A.reset();
    },
    reset() {
      A.pos.x = A.pos.y = A.vel.x = A.vel.y = A.tilt = A.tiltVel = 0;
      A.target.x = A.target.y = A.target.tilt = 0;
      Object.assign(A.fx, { scale: 1, scaleAnchor: POINTS.bottom, flip: 0, lift: 0, sway: 0, alpha: 1, ghost: 0, green: 0, chomp: 0 });
      A.shakeT = -1;
      A.update(0);
    },
    // 拖动：按下的位置为起点，拖多远头就偏多少、往哪边歪
    dragStart(x, y) { A.drag = { x0: x, y0: y }; },
    dragMove(x, y) {
      if (!A.drag) return;
      const dx = x - A.drag.x0, dy = y - A.drag.y0;
      A.target.x = clamp(dx, -300, 300);
      A.target.y = clamp(dy * 0.5, -70, 90);
      A.target.tilt = clamp(dx / 800, -0.42, 0.42);
    },
    dragEnd() { A.drag = null; A.target.x = A.target.y = A.target.tilt = 0; },
    shake() { A.shakeT = 0; },

    update(dt) {
      const s = dt / 1000;
      A.time += s;
      // 目标：拖动 > 甩头 > 自动轻晃 > 回正
      if (!A.drag) {
        if (A.shakeT >= 0) {
          A.shakeT += s;
          // 使劲甩头：左右甩 3 下（2.4 次/秒），越甩越轻
          const env = Math.max(0, 1 - A.shakeT / 1.3), w = Math.PI * 2 * 2.4;
          A.target.tilt = 0.5 * Math.sin(w * A.shakeT) * env;
          A.target.x = 110 * Math.sin(w * A.shakeT + Math.PI / 2) * env;
          A.target.y = 0;
          if (A.shakeT > 1.3) { A.shakeT = -1; A.target.tilt = A.target.x = 0; }
        } else if (A.auto) {
          A.target.x = 30 * Math.sin(A.time * 0.9) + 10 * Math.sin(A.time * 2.3);
          A.target.tilt = 0.07 * Math.sin(A.time * 1.3 + 1);
          A.target.y = 6 * Math.sin(A.time * 1.7);
        } else {
          A.target.x = A.target.y = A.target.tilt = 0;
        }
      }
      if (s > 0) {
        const k = 260, c = 2 * Math.sqrt(k) * 0.6;
        const ax = k * (A.target.x - A.pos.x) - c * A.vel.x;
        const ay = k * (A.target.y - A.pos.y) - c * A.vel.y;
        const at = 300 * (A.target.tilt - A.tilt) - 2 * Math.sqrt(300) * 0.55 * A.tiltVel;
        A.vel.x += ax * s; A.vel.y += ay * s; A.tiltVel += at * s;
        A.pos.x += A.vel.x * s; A.pos.y += A.vel.y * s; A.tilt += A.tiltVel * s;
        A.acc.x = ax; A.acc.y = ay; A.angAcc = at;
      }
      // 图片坐标 → 舞台坐标
      const f = A.fx;
      const rot = A.tilt + f.sway;
      const sc = A.baseScale * (1 + f.chomp * 0.035);
      const m = new DOMMatrix()
        .translate(A.stage.x + A.pos.x, A.stage.y + A.pos.y - f.lift)
        .rotate((rot * 180) / Math.PI)
        .scale(sc, sc)
        .translate(-PIVOT.x, -PIVOT.y)
        .translate(POINTS.center.x, POINTS.center.y)
        .rotate((f.flip * 180) / Math.PI)
        .translate(-POINTS.center.x, -POINTS.center.y)
        .translate(f.scaleAnchor.x, f.scaleAnchor.y)
        .scale(f.scale, f.scale)
        .translate(-f.scaleAnchor.x, -f.scaleAnchor.y);
      A.matrix = m;
    },
    // 关键点在舞台上的位置
    point(name) { const p = POINTS[name]; return A.toStage(p.x, p.y); },
    toStage(x, y) { const m = A.matrix; return { x: m.a * x + m.c * y + m.e, y: m.b * x + m.d * y + m.f }; },
    // 头的整体朝向（弧度）和缩放：贴在头上的东西用它
    angle() { return Math.atan2(A.matrix.b, A.matrix.a); },
    scale() { return Math.hypot(A.matrix.a, A.matrix.b); },
    // 在皮套坐标系里画东西（图片像素为单位）
    withFrame(g, fn) { g.save(); const m = A.matrix; g.transform(m.a, m.b, m.c, m.d, m.e, m.f); fn(g); g.restore(); },

    draw(g) {
      const f = A.fx;
      if (!(f.alpha > 0.01)) return;
      A.withFrame(g, g => {
        g.globalAlpha = f.alpha;
        g.drawImage(A.img, 0, 0);
        if (f.ghost > 0.01) { g.globalAlpha = f.alpha * f.ghost; g.drawImage(A.tints.ghost, 0, 0); }
        if (f.green > 0.01) { g.globalAlpha = f.alpha * f.green; g.drawImage(A.tints.green, 0, 0); }
      });
      // 附身时眼睛发蓝光
      if (f.ghost > 0.05) {
        g.save();
        g.globalCompositeOperation = 'lighter';
        const r = 46 * A.scale() / A.baseScale * 0.66;
        for (const e of ['eyeL', 'eyeR']) {
          const p = A.point(e), gr = g.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
          gr.addColorStop(0, 'rgba(170,240,255,' + (0.9 * f.ghost).toFixed(3) + ')');
          gr.addColorStop(0.35, 'rgba(90,190,255,' + (0.45 * f.ghost).toFixed(3) + ')');
          gr.addColorStop(1, 'rgba(60,150,255,0)');
          g.fillStyle = gr;
          g.fillRect(p.x - r, p.y - r, r * 2, r * 2);
        }
        g.restore();
      }
    },
  });
})();

/* particles.js */
/* 万圣节砸砸乐试玩 · 通用粒子：糖果碎屑、药水滴、玻璃渣、烟、星星、泡泡、飘字、小图 */
(function () {
  'use strict';
  const HW = window.HW;
  const { TAU, range, pick, label } = HW.util;
  const list = [];
  const P = (HW.particles = {
    list,
    add(p) { list.push(Object.assign({ age: 0, life: 1, vx: 0, vy: 0, g: 0, drag: 0, rot: 0, vr: 0, size: 10, o: 1, grow: 0 }, p)); },
    clear() { list.length = 0; },
    update(dt) {
      const s = dt / 1000;
      for (let i = list.length - 1; i >= 0; i--) {
        const p = list[i];
        p.age += s;
        if (p.age >= p.life) { list.splice(i, 1); continue; }
        p.vy += p.g * s;
        const d = Math.exp(-p.drag * s);
        p.vx *= d; p.vy *= d;
        p.x += p.vx * s; p.y += p.vy * s; p.rot += p.vr * s;
        if (p.floor && p.y > p.floor) { p.y = p.floor; p.vy *= -0.35; p.vx *= 0.7; }
      }
    },
    draw(g) {
      for (const p of list) {
        const k = p.age / p.life, fade = p.o * (k > 0.65 ? 1 - (k - 0.65) / 0.35 : 1);
        g.save();
        g.globalAlpha = fade;
        g.translate(p.x, p.y);
        g.rotate(p.rot);
        const sz = p.size * (1 + p.grow * k);
        switch (p.kind) {
          case 'confetti':
            g.fillStyle = p.color; g.fillRect(-sz / 2, -sz / 4, sz, sz / 2); break;
          case 'drop':
            g.fillStyle = p.color; g.beginPath(); g.ellipse(0, 0, sz * 0.6, sz, 0, 0, TAU); g.fill();
            g.fillStyle = 'rgba(255,255,255,.55)'; g.beginPath(); g.arc(-sz * 0.2, -sz * 0.35, sz * 0.18, 0, TAU); g.fill(); break;
          case 'shard':
            g.fillStyle = p.color; g.strokeStyle = 'rgba(40,30,60,.5)'; g.lineWidth = 1.5;
            g.beginPath(); g.moveTo(-sz, -sz * 0.3); g.lineTo(sz * 0.8, -sz * 0.6); g.lineTo(sz * 0.4, sz * 0.7); g.closePath(); g.fill(); g.stroke(); break;
          case 'puff': {
            const gr = g.createRadialGradient(0, 0, 0, 0, 0, sz);
            gr.addColorStop(0, p.color || 'rgba(240,236,250,.95)'); gr.addColorStop(0.6, 'rgba(210,204,230,.55)'); gr.addColorStop(1, 'rgba(200,195,225,0)');
            g.fillStyle = gr; g.beginPath(); g.arc(0, 0, sz, 0, TAU); g.fill(); break;
          }
          case 'spark':
            g.globalCompositeOperation = 'lighter';
            g.fillStyle = p.color || '#FFF2B0';
            g.beginPath();
            for (let i = 0; i < 8; i++) { const a = (i * Math.PI) / 4, r = i % 2 ? sz * 0.22 : sz; g.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
            g.closePath(); g.fill(); break;
          case 'bubble':
            g.strokeStyle = p.color || 'rgba(160,255,140,.9)'; g.lineWidth = 3; g.beginPath(); g.arc(0, 0, sz, 0, TAU); g.stroke();
            g.fillStyle = 'rgba(255,255,255,.6)'; g.beginPath(); g.arc(-sz * 0.35, -sz * 0.35, sz * 0.22, 0, TAU); g.fill(); break;
          case 'image':
            g.drawImage(p.image, -sz / 2, -sz / 2 * (p.image.height / p.image.width), sz, sz * (p.image.height / p.image.width)); break;
          case 'text':
            g.rotate(-p.rot);
            label(g, p.text, 0, 0, { size: sz, fill: p.color || '#FFF6E8', align: 'center' }); break;
        }
        g.restore();
      }
    },
    // 常用的一团：糖果碎屑
    burstCandy(x, y, n = 18, spread = 1) {
      for (let i = 0; i < n; i++) {
        const a = range(-Math.PI, 0), sp = range(220, 620) * spread;
        P.add({ kind: 'confetti', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 1100, drag: 1.2, life: range(0.9, 1.5), size: range(10, 18), vr: range(-9, 9), color: pick(['#FF8FB8', '#7FE0C2', '#FFD24A', '#B99BFF', '#FF8A1F']) });
      }
    },
    puffs(x, y, n = 10, r = 60) {
      for (let i = 0; i < n; i++) {
        const a = range(0, TAU), sp = range(40, 160);
        P.add({ kind: 'puff', x: x + Math.cos(a) * r * 0.4, y: y + Math.sin(a) * r * 0.4, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40, drag: 2.2, life: range(0.6, 1.1), size: range(r * 0.5, r), grow: 0.8 });
      }
    },
    sparks(x, y, n = 8, color) {
      for (let i = 0; i < n; i++) {
        const a = range(0, TAU), sp = range(80, 300);
        P.add({ kind: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, drag: 2.5, life: range(0.4, 0.8), size: range(8, 16), vr: range(-6, 6), color });
      }
    },
    text(x, y, text, size = 40, color) { P.add({ kind: 'text', x, y, vy: -60, drag: 1.5, life: 1.1, size, text, color }); },
  });
})();

/* fx-tower.js */
/* A · 南瓜叠叠乐：南瓜灯一层层叠在头顶，塔跟着头晃；晃太猛、歪太久、倒立都会塌。
   每层是一个「倒立摆」：重力想让它倒，层与层之间的摩擦想让它站直，头的加速度把它甩来甩去。 */
(function () {
  'use strict';
  const HW = window.HW;
  const { range, rand, clamp, label } = HW.util;
  const BODY_W = 185;                       // 南瓜小图里身体的宽度（像素）
  const G = 5.5, C = 4.2, SLIP = 0.4, STEEP = 1.05, FLOOR = 900;

  const T = (HW.tower = {
    layers: [], falling: [], loose: [], record: 0, tiltHold: 0, peak: 0, lastCrash: -9,
    clear(gentle) {
      if (T.layers.length) collapse(0, gentle);
      T.falling.length = 0;
    },
    reset() { T.layers.length = 0; T.falling.length = 0; T.loose.length = 0; T.record = 0; T.tiltHold = 0; T.peak = 0; T.lastCrash = -9; },
    count() { return T.layers.length; },
    add() {
      const top = topPoint(), n = T.layers.length + T.falling.length;
      const w = widthOf(n);
      T.falling.push({ x: top.x + range(-36, 36), y: -140, vx: range(-30, 30), vy: 260, rot: range(-0.3, 0.3), vr: range(-2, 2), w, variant: Math.floor(rand() * 3) });
      HW.sfx.whoosh();
      return n + 1;
    },
    update(dt) {
      const s = dt / 1000, A = HW.avatar;
      // 头歪着不动太久，最底层会滑
      const phi = A.angle();
      T.tiltHold = Math.abs(phi) > 0.6 ? T.tiltHold + s : 0;
      if (T.layers.length && T.tiltHold > 0.5) collapse(0);
      // 物理：分 3 小步算，稳定一些
      const steps = 3, h = s / steps;
      for (let k = 0; k < steps && T.layers.length; k++) {
        let Phi = phi;
        for (let i = 0; i < T.layers.length; i++) {
          const L = T.layers[i];
          Phi += L.theta;
          const K = Math.max(12, 40 - 2.6 * i);
          const alpha = G * Math.sin(Phi) - (A.acc.x * Math.cos(Phi) + A.acc.y * Math.sin(Phi)) / 420 - A.angAcc * 0.35 - K * L.theta - C * L.omega;
          L.omega += alpha * h;
          L.theta += L.omega * h;
        }
      }
      // 太歪 / 滑开就从那一层开始塌
      let Phi = phi;
      for (let i = 0; i < T.layers.length; i++) {
        Phi += T.layers[i].theta;
        if (Math.abs(T.layers[i].theta) > SLIP || Math.abs(Phi) > STEEP) { collapse(i); break; }
      }
      for (const L of T.layers) L.squash = Math.max(0, L.squash - s * 4);
      // 正在掉下来的南瓜：碰到塔顶就叠上去
      for (let i = T.falling.length - 1; i >= 0; i--) {
        const p = T.falling[i];
        p.vy += 2400 * s; p.x += p.vx * s; p.y += p.vy * s; p.rot += p.vr * s;
        const top = topPoint(), hh = p.w * 0.36;
        if (p.vy > 0 && p.y + hh >= top.y && p.y + hh < top.y + 80) {
          const dx = p.x - top.x;
          if (Math.abs(dx) < p.w * 0.75) {
            T.falling.splice(i, 1);
            land(p, dx);
            continue;
          }
        }
        if (p.y > FLOOR + 200) { T.falling.splice(i, 1); }
        else if (p.y > top.y + 120) { T.falling.splice(i, 1); T.loose.push(Object.assign(p, { bounced: 0 })); }
      }
      updateLoose(s);
    },
    draw(g, t) {
      const A = HW.avatar;
      for (const p of T.loose) drawPumpkin(g, p.x, p.y, p.rot, p.w, p.variant, 0, t, 0);
      if (T.layers.length) {
        let base = A.point('headTop'), Phi = A.angle();
        for (let i = 0; i < T.layers.length; i++) {
          const L = T.layers[i];
          Phi += L.theta;
          const h = L.w * 0.62, sin = Math.sin(Phi), cos = Math.cos(Phi);
          const cx = base.x + sin * h * 0.5, cy = base.y - cos * h * 0.5;
          drawPumpkin(g, cx, cy, Phi, L.w, L.variant, L.squash, t, i);
          base = { x: base.x + sin * h, y: base.y - cos * h };
        }
        // 层数：塔顶旁边，塔顶出了屏幕就在上沿提示
        const n = T.layers.length;
        if (n >= 2) {
          if (base.y < 30) label(g, '↑ ' + n + ' 层', clamp(base.x, 80, 1520), 40, { size: 34, align: 'center', fill: '#FFD45C' });
          else label(g, n + ' 层', base.x + 70, base.y + 20, { size: 30, fill: '#FFD45C' });
        }
      }
      for (const p of T.falling) drawPumpkin(g, p.x, p.y, p.rot, p.w, p.variant, 0, t, 0);
    },
  });

  function widthOf(i) { return 128 * Math.pow(0.95, i); }
  function topPoint() {
    const A = HW.avatar;
    let base = A.point('headTop'), Phi = A.angle();
    for (const L of T.layers) {
      Phi += L.theta;
      const h = L.w * 0.62;
      base = { x: base.x + Math.sin(Phi) * h, y: base.y - Math.cos(Phi) * h };
    }
    return base;
  }
  function land(p, dx) {
    const L = { w: widthOf(T.layers.length), variant: p.variant, theta: clamp(dx / (p.w * 1.8) + p.rot * 0.15, -0.22, 0.22), omega: clamp(p.vx / 300, -1, 1) + range(-0.6, 0.6), squash: 1 };
    T.layers.push(L);
    for (const other of T.layers) other.omega += range(-0.25, 0.25);
    T.record = Math.max(T.record, T.layers.length);
    T.peak = Math.max(T.peak, T.layers.length);
    HW.sfx.thud();
  }
  // 从第 k 层开始往上全部变成散落的南瓜
  function collapse(k, gentle) {
    const A = HW.avatar;
    let base = A.point('headTop'), Phi = A.angle();
    const out = [];
    for (let i = 0; i < T.layers.length; i++) {
      const L = T.layers[i];
      Phi += L.theta;
      const h = L.w * 0.62, sin = Math.sin(Phi), cos = Math.cos(Phi);
      if (i >= k) {
        const lean = Math.sign(Phi || range(-1, 1));
        out.push({ x: base.x + sin * h * 0.5, y: base.y - cos * h * 0.5, w: L.w, variant: L.variant, rot: Phi,
          vx: gentle ? range(-160, 160) : A.vel.x * 0.6 + lean * range(160, 420) + L.omega * 120,
          vy: gentle ? range(-520, -300) : range(-260, -60), vr: gentle ? range(-3, 3) : lean * range(2, 6) + L.omega, bounced: 0, gentle: !!gentle });
      }
      base = { x: base.x + sin * h, y: base.y - cos * h };
    }
    const n = T.layers.length;
    T.layers.length = k;
    T.loose.push(...out);
    // 一次倒塌常常是从上往下连着几层掉：1.5 秒内只提示一次，报这一轮叠到的最高层数
    const now = HW.avatar.time;
    if (out.length && !gentle) {
      HW.sfx.crash();
      if (now - T.lastCrash > 1.5) HW.ui.toast('南瓜塔塌啦！这次叠到 ' + Math.max(n, T.peak) + ' 层');
      T.lastCrash = now;
    }
    if (!T.layers.length) T.peak = 0;
  }
  function updateLoose(s) {
    for (let i = T.loose.length - 1; i >= 0; i--) {
      const p = T.loose[i];
      p.vy += 2200 * s; p.x += p.vx * s; p.y += p.vy * s; p.rot += p.vr * s;
      const floor = FLOOR - p.w * 0.3;
      if (p.y >= floor) {
        if (p.gentle || p.bounced >= 1 || Math.abs(p.vy) > 500) {
          // 摔开变糖
          HW.particles.burstCandy(p.x, floor, 16, 0.9);
          for (let j = 0; j < 6; j++) HW.particles.add({ kind: 'shard', x: p.x, y: floor - 10, vx: range(-300, 300), vy: range(-500, -200), g: 1500, life: range(0.6, 1), size: range(10, 18), vr: range(-8, 8), color: '#F58A22' });
          if (!p.gentle) HW.sfx.pop();
          T.loose.splice(i, 1);
          continue;
        }
        p.y = floor; p.vy *= -0.4; p.vx *= 0.7; p.bounced++;
      }
      if (p.x < -200 || p.x > 1800) T.loose.splice(i, 1);
    }
  }
  function drawPumpkin(g, x, y, rot, w, variant, squash, t, i) {
    const img = HW.art.pumpkins[variant], s = w / BODY_W;
    g.save();
    g.translate(x, y);
    g.rotate(rot);
    g.scale(s * (1 + 0.14 * squash), s * (1 - 0.14 * squash));
    g.drawImage(img, -img.width / 2, -img.height * 0.6);
    // 南瓜灯里的火光一闪一闪
    g.globalCompositeOperation = 'lighter';
    const fl = 0.22 + 0.1 * Math.sin(t * 13 + i * 2.1) + 0.06 * Math.sin(t * 29 + i);
    const gr = g.createRadialGradient(0, 4, 0, 0, 4, 90);
    gr.addColorStop(0, 'rgba(255,200,80,' + fl.toFixed(3) + ')');
    gr.addColorStop(1, 'rgba(255,140,30,0)');
    g.fillStyle = gr;
    g.fillRect(-100, -86, 200, 180);
    g.restore();
  }
})();

/* fx-flood.js */
/* B · 南瓜淹没：南瓜和糖从天上掉下来，从屏幕底部往上堆，绕开脸；堆满了就记 +N。
   堆好的东西画进一张底图里（不再每帧重画），每帧只在底图上挖出脸的位置。 */
(function () {
  'use strict';
  const HW = window.HW;
  const { range, rand, pick, label } = HW.util;
  const COL = 16, NCOL = Math.ceil(HW.W / COL), TOP = 46;

  const F = (HW.flood = {
    cols: new Float32Array(NCOL), falling: [], count: 0, overflow: 0, layer: null, cut: null, drain: -1,
    init() {
      F.layer = document.createElement('canvas');
      F.layer.width = HW.W; F.layer.height = HW.H;
      F.cut = document.createElement('canvas');
      F.cut.width = HW.W; F.cut.height = HW.H;
      F.reset();
    },
    reset() {
      F.cols.fill(HW.H); F.falling.length = 0; F.count = 0; F.overflow = 0; F.drain = -1;
      F.layer.getContext('2d').clearRect(0, 0, HW.W, HW.H);
    },
    // 一次掉一把：几个南瓜 + 几颗糖
    add(n = 6) {
      for (let i = 0; i < n; i++) {
        const isPumpkin = rand() < 0.45;
        F.falling.push({
          x: range(40, HW.W - 40), y: range(-260, -60), vx: range(-40, 40), vy: range(0, 200), rot: range(-0.5, 0.5), vr: range(-3, 3),
          img: isPumpkin ? pick(HW.art.pumpkins) : pick(HW.art.candies), w: isPumpkin ? range(130, 175) : range(84, 110), pumpkin: isPumpkin,
        });
      }
      HW.sfx.whoosh();
    },
    clear() { if (F.count || F.falling.length) { F.drain = 0; F.falling.length = 0; } },
    update(dt) {
      const s = dt / 1000;
      if (F.drain >= 0) {
        F.drain += s;
        if (F.drain > 1.1) F.reset();
        return;
      }
      for (let i = F.falling.length - 1; i >= 0; i--) {
        const p = F.falling[i];
        p.vy += 1900 * s; p.x += p.vx * s; p.y += p.vy * s; p.rot += p.vr * s;
        const h = p.w * (p.img.height / p.img.width);
        const surface = surfaceAt(p.x, p.w);
        if (p.y + h * 0.35 >= surface) { F.falling.splice(i, 1); settle(p, h); }
      }
    },
    // 堆在皮套前面，但脸的位置挖空
    draw(g) {
      if (!F.count && !F.falling.length) return;
      const off = F.drain >= 0 ? Math.pow(F.drain / 1.1, 2) * HW.H : 0;
      const c = F.cut.getContext('2d');
      c.globalCompositeOperation = 'source-over';
      c.clearRect(0, 0, HW.W, HW.H);
      c.drawImage(F.layer, 0, off);
      const A = HW.avatar, hole = A.FACE_HOLE, p = A.toStage(hole.x, hole.y), sc = A.scale();
      c.globalCompositeOperation = 'destination-out';
      c.save();
      c.translate(p.x, p.y);
      c.rotate(A.angle());
      c.scale(hole.rx * sc, hole.ry * sc);
      const gr = c.createRadialGradient(0, 0, 0.7, 0, 0, 1);
      gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = gr;
      c.beginPath(); c.arc(0, 0, 1, 0, Math.PI * 2); c.fill();
      c.restore();
      g.drawImage(F.cut, 0, 0);
      for (const q of F.falling) drawItem(g, q);
      if (F.overflow > 0) label(g, '堆满了 +' + F.overflow, HW.W - 40, 118, { size: 30, align: 'right', fill: '#FFD45C' });
    },
  });

  function surfaceAt(x, w) {
    let y = HW.H;
    const a = Math.max(0, Math.floor((x - w * 0.35) / COL)), b = Math.min(NCOL - 1, Math.floor((x + w * 0.35) / COL));
    for (let j = a; j <= b; j++) y = Math.min(y, F.cols[j]);
    return y;
  }
  // 脸附近（静止时的位置）不能放东西
  function blocked(x, y, w, h) {
    const A = HW.avatar, hole = A.FACE_HOLE, s = A.baseScale;
    const cx = A.stage.x + (hole.x - 545) * s, cy = A.stage.y + (hole.y - 520) * s;
    const rx = hole.rx * s + w * 0.4, ry = hole.ry * s + h * 0.4;
    return ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 < 1;
  }
  function settle(p, h) {
    let x = p.x, y = surfaceAt(x, p.w) - h * 0.32;
    // 挡住脸了就往旁边挪
    if (blocked(x, y, p.w, h)) {
      const dir = x < HW.W / 2 ? -1 : 1;
      let moved = false;
      for (let step = 1; step < 60; step++) {
        for (const d of [dir, -dir]) {
          const nx = x + d * step * 14;
          if (nx < 30 || nx > HW.W - 30) continue;
          const ny = surfaceAt(nx, p.w) - h * 0.32;
          if (!blocked(nx, ny, p.w, h)) { x = nx; y = ny; moved = true; break; }
        }
        if (moved) break;
      }
      if (!moved) { F.overflow++; return; }
    }
    if (y - h * 0.5 < TOP) { F.overflow++; return; }
    const a = Math.max(0, Math.floor((x - p.w * 0.42) / COL)), b = Math.min(NCOL - 1, Math.floor((x + p.w * 0.42) / COL));
    for (let j = a; j <= b; j++) F.cols[j] = Math.min(F.cols[j], y - h * 0.28);
    F.count++;
    drawItem(F.layer.getContext('2d'), { x, y, rot: p.rot * 0.3, w: p.w, img: p.img });
    if (p.pumpkin) HW.sfx.thud(); else if (rand() < 0.3) HW.sfx.pop();
  }
  function drawItem(g, q) {
    const h = q.w * (q.img.height / q.img.width);
    g.save();
    g.translate(q.x, q.y);
    g.rotate(q.rot);
    g.drawImage(q.img, -q.w / 2, -h / 2, q.w, h);
    g.restore();
  }
})();

/* fx-ghost.js */
/* C · 小幽灵附身：每次来一只小幽灵绕着头飞，凑够 NEED 只就附身——
   皮套变成半透明淡蓝色、眼睛发光、飘起来左右晃（真插件里用 VTS 染色 + 移动），10 秒后幽灵散开。 */
(function () {
  'use strict';
  const HW = window.HW;
  const { TAU, range, rand, lerp, seg, ease, label } = HW.util;
  const NEED = 5, HOLD = 10;

  const Gh = (HW.ghosts = {
    list: [], possess: -1, leaving: [],
    fx: { ghost: 0, alpha: 1, lift: 0, sway: 0 },          // 交给皮套的：染色、透明、上浮、摇晃
    reset() { Gh.list.length = 0; Gh.leaving.length = 0; Gh.possess = -1; restore(); },
    add() {
      const side = rand() < 0.5 ? -1 : 1;
      Gh.list.push({ phase: range(0, TAU), speed: range(1.1, 1.6), rx: range(250, 320), ry: range(70, 110), bob: range(0, TAU), variant: Math.floor(rand() * 3),
        x: side < 0 ? -120 : HW.W + 120, y: range(120, 500), enter: 0 });
      HW.sfx.boo();
      if (Gh.possess >= 0) Gh.possess = Math.max(0, Gh.possess - 2);   // 附身中再来一只：多附身 2 秒
      return Gh.list.length;
    },
    clear() { if (Gh.possess >= 0) Gh.possess = HOLD; scatter(); },
    update(dt) {
      const s = dt / 1000, c = HW.avatar.point('face');
      if (Gh.possess < 0 && Gh.list.length >= NEED && Gh.list.every(g => g.enter >= 1)) { Gh.possess = 0; HW.sfx.possess(); HW.ui.toast('小幽灵附身啦！'); }
      if (Gh.possess >= 0) {
        Gh.possess += s;
        const t = Gh.possess;
        // 前 1.2 秒：幽灵螺旋着钻进身体；然后附身 HOLD 秒；最后散开
        const k = ease.outCubic(seg(t, 1.0, 2.0)), back = seg(t, HOLD + 1.2, HOLD + 2.0);
        Gh.fx.ghost = k * (1 - back);
        Gh.fx.alpha = lerp(1, 0.7, k * (1 - back));
        Gh.fx.lift = 80 * ease.inOutSine(seg(t, 1.2, 2.6)) * (1 - back);
        Gh.fx.sway = 0.07 * Math.sin(t * 2.1) * k * (1 - back);
        if (t > 0.6 && t < 0.62 + s) HW.particles.sparks(c.x, c.y, 16, '#BFE6FF');
        if (t >= HOLD + 1.2 && Gh.list.length) { scatter(); HW.sfx.boo(); HW.particles.text(c.x, c.y - 160, 'Boo!', 60, '#DDF2FF'); }
        if (t >= HOLD + 2.0) { Gh.possess = -1; restore(); }
      }
      for (const g of Gh.list) {
        g.phase += g.speed * s;
        g.bob += 3 * s;
        let tx = c.x + Math.cos(g.phase) * g.rx, ty = c.y - 40 + Math.sin(g.phase) * g.ry + Math.sin(g.bob) * 10;
        if (Gh.possess >= 0) {
          const k = seg(Gh.possess, 0, 1.2);
          tx = lerp(tx, c.x, ease.inCubic(k)); ty = lerp(ty, c.y, ease.inCubic(k));
          g.speed = lerp(g.speed, 6, k * s * 2);
        }
        if (g.enter < 1) {
          g.enter = Math.min(1, g.enter + s / 0.9);
          const e = ease.outCubic(g.enter);
          g.x = lerp(g.x, tx, e * 0.25 + 0.05); g.y = lerp(g.y, ty, e * 0.25 + 0.05);
        } else { g.x = tx; g.y = ty; }
      }
      for (let i = Gh.leaving.length - 1; i >= 0; i--) {
        const g = Gh.leaving[i];
        g.x += g.vx * s; g.y += g.vy * s; g.age += s;
        if (g.age > 2) Gh.leaving.splice(i, 1);
      }
    },
    // depth < 0 的在皮套后面，> 0 的在前面
    draw(g, front) {
      const inside = Gh.possess >= 0 && Gh.possess > 1.2 && Gh.possess < HOLD + 1.2;
      for (const q of Gh.list) {
        if (inside) continue;
        const depth = Math.sin(q.phase);
        if ((depth > 0) !== front) continue;
        const k = Gh.possess >= 0 ? 1 - seg(Gh.possess, 0.6, 1.2) : 1;
        drawGhost(g, q.x, q.y, 0.82 + depth * 0.12, q.variant, (front ? 0.95 : 0.6) * k, Math.sin(q.bob) * 0.12);
      }
      if (front) {
        for (const q of Gh.leaving) drawGhost(g, q.x, q.y, 0.85, q.variant, 1 - q.age / 2, q.vx > 0 ? 0.2 : -0.2);
        if (Gh.list.length && Gh.possess < 0) label(g, '小幽灵 ' + Gh.list.length + '/' + NEED, 40, HW.H - 60, { size: 30, fill: '#DDF2FF' });
      }
    },
  });

  function scatter() {
    const c = HW.avatar.point('face');
    for (const q of Gh.list) {
      const a = range(0, TAU), sp = range(500, 900);
      Gh.leaving.push({ x: c.x, y: c.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 100, variant: q.variant, age: 0 });
    }
    Gh.list.length = 0;
  }
  function restore() { Object.assign(Gh.fx, { ghost: 0, alpha: 1, lift: 0, sway: 0 }); }
  function drawGhost(g, x, y, s, variant, alpha, rot) {
    const img = HW.art.ghosts[variant];
    g.save();
    g.globalAlpha = Math.max(0, alpha);
    g.translate(x, y);
    g.rotate(rot);
    g.scale(s, s);
    g.shadowColor = 'rgba(190,220,255,.8)';
    g.shadowBlur = 24;
    g.drawImage(img, -img.width / 2, -img.height / 2);
    g.restore();
  }
})();

/* fx-potion.js */
/* D · 变身药水：药水瓶飞过来砸到脸上溅开，随机变身 HOLD 秒，时间到「噗」一团烟变回来。
   瓶子颜色就是效果：紫=缩小、红=变大、绿=变绿、蓝=倒立、白粉=隐身。
   真插件里由 VTS 完成（缩放 / 旋转 / 染色 / 透明），这里用皮套替身的变换模拟。 */
(function () {
  'use strict';
  const HW = window.HW;
  const { TAU, range, rand, pick, seg, ease, arcPoint, lerp } = HW.util;
  const HOLD = 8, FLY = 0.75;
  const KEYS = ['shrink', 'grow', 'green', 'flip', 'fade'];

  const Po = (HW.potion = {
    flying: [], cur: null,
    fx: { scale: 1, anchor: 'bottom', flip: 0, green: 0, alpha: 1 },
    reset() { Po.flying.length = 0; Po.cur = null; Object.assign(Po.fx, { scale: 1, anchor: 'bottom', flip: 0, green: 0, alpha: 1 }); },
    add(name, key = pick(KEYS)) {
      const side = rand() < 0.5 ? -1 : 1;
      Po.flying.push({ key, name, t: 0, from: { x: side < 0 ? -90 : HW.W + 90, y: range(480, 700) }, spin: side * range(8, 12) });
      HW.sfx.whoosh();
      return HW.art.POTIONS[key].name;
    },
    clear() { if (Po.cur && Po.cur.t < HOLD) { Po.cur.t = HOLD; poof(); } Po.flying.length = 0; },
    update(dt) {
      const s = dt / 1000, A = HW.avatar;
      for (let i = Po.flying.length - 1; i >= 0; i--) {
        const b = Po.flying[i];
        b.t += s / FLY;
        if (b.t >= 1) { Po.flying.splice(i, 1); hit(b, A.point('face')); }
      }
      const f = Po.fx;
      Object.assign(f, { scale: 1, flip: 0, green: 0, alpha: 1 });
      const c = Po.cur;
      if (!c) return;
      c.t += s;
      const out = seg(c.t, HOLD, HOLD + 0.45), inK = seg(c.t, 0, 0.6), on = 1 - out;
      switch (c.key) {
        case 'shrink': f.anchor = 'bottom'; f.scale = lerp(1, 0.45, ease.outElastic(inK) * on); break;
        case 'grow': f.anchor = 'face'; f.scale = lerp(1, 1.75, ease.outElastic(inK) * on); break;
        case 'green': f.green = ease.inOutSine(inK) * on;
          if (c.t < HOLD && rand() < s * 7) { const p = A.point('headTop'); HW.particles.add({ kind: 'bubble', x: p.x + range(-120, 120), y: p.y + range(0, 80), vy: range(-140, -70), vx: range(-20, 20), life: range(1, 1.6), size: range(8, 16) }); if (rand() < 0.4) HW.sfx.bubble(); }
          break;
        case 'flip': f.flip = Math.PI * ease.outBack(inK) * on; break;
        case 'fade': f.alpha = lerp(1, 0.14, ease.inOutSine(inK) * on);
          if (c.t < HOLD && rand() < s * 6) { const p = A.point('chest'); HW.particles.add({ kind: 'spark', x: p.x + range(-260, 260), y: p.y + range(-420, 100), life: 0.7, size: range(8, 14), color: '#F7E6FF' }); }
          break;
      }
      if (c.t >= HOLD && !c.poofed) { c.poofed = true; poof(); }
      if (c.t >= HOLD + 0.5) Po.cur = null;
    },
    draw(g) {
      const A = HW.avatar, to = A.point('face');
      for (const b of Po.flying) {
        const p = arcPoint(b.from, to, ease.inCubic(b.t) * 0.35 + b.t * 0.65, 260), img = HW.art.potions[b.key];
        g.save();
        g.translate(p.x, p.y);
        g.rotate(b.t * b.spin);
        g.drawImage(img, -img.width / 2 * 0.8, -img.height / 2 * 0.8, img.width * 0.8, img.height * 0.8);
        g.restore();
      }
    },
  });

  function hit(b, at) {
    const P = HW.art.POTIONS[b.key];
    HW.sfx.glass();
    for (let i = 0; i < 22; i++) {
      const a = range(0, TAU), sp = range(200, 700);
      HW.particles.add({ kind: 'drop', x: at.x, y: at.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120, g: 1400, drag: 1, life: range(0.5, 0.9), size: range(8, 15), color: P.color, rot: a });
    }
    for (let i = 0; i < 8; i++) HW.particles.add({ kind: 'shard', x: at.x, y: at.y, vx: range(-420, 420), vy: range(-500, -100), g: 1500, life: range(0.5, 0.8), size: range(6, 11), vr: range(-10, 10), color: 'rgba(200,236,255,.9)' });
    if (Po.cur && Po.cur.t < HOLD) poof();
    Po.cur = { key: b.key, t: 0 };
    HW.ui.toast(b.name + ' 的变身药水：' + P.name + '！');
    HW.particles.text(at.x, at.y - 170, P.name + '！', 54, P.color);
    setTimeout(() => HW.sfx.boing(), 120);
  }
  function poof() {
    const c = HW.avatar.point('chest');
    HW.particles.puffs(c.x, c.y - 120, 14, 110);
    HW.sfx.poof();
  }
})();

/* fx-mummy.js */
/* E · 木乃伊缠绕：每次多缠一圈绷带（跟着头动），缠满 10 圈只露眼睛；
   主播使劲甩头会把最外面的一圈甩掉（真插件里用 VTS 头部跟随的速度来判断）。 */
(function () {
  'use strict';
  const HW = window.HW;
  const { range, rand, seg, label } = HW.util;
  // 每一圈的位置（立绘像素）：x, y, 角度, 长, 粗。眼睛那一条（y≈290–335）不横着缠，留出来
  const SLOTS = [
    [545, 262, 0.07, 450, 60], [545, 365, -0.06, 430, 58], [545, 205, -0.1, 440, 62], [545, 420, 0.09, 410, 56],
    [545, 345, 1.15, 440, 50], [545, 345, -1.15, 440, 50], [548, 465, -0.04, 360, 54], [545, 150, 0.04, 390, 60],
    [428, 380, 1.42, 250, 50], [662, 380, -1.42, 250, 50],
  ];
  const WRAP_T = 0.35;

  const M = (HW.mummy = {
    strips: [], loose: [], energy: 0, full: false,
    reset() { M.strips.length = 0; M.loose.length = 0; M.energy = 0; M.full = false; },
    add() {
      if (M.strips.length >= SLOTS.length) return M.strips.length;
      const used = new Set(M.strips.map(s => s.slot));
      const free = SLOTS.map((_, i) => i).filter(i => !used.has(i));
      const slot = free.length > 4 && rand() < 0.5 ? free[Math.floor(rand() * Math.min(3, free.length))] : free[0];
      M.strips.push({ slot, t: 0, variant: Math.floor(rand() * 3), dir: rand() < 0.5 ? -1 : 1 });
      HW.sfx.wrap();
      if (M.strips.length === SLOTS.length && !M.full) { M.full = true; setTimeout(() => HW.ui.toast('变成木乃伊啦！'), 400); }
      return M.strips.length;
    },
    clear() { while (M.strips.length) unwrap(true); },
    update(dt) {
      const s = dt / 1000, A = HW.avatar;
      for (const st of M.strips) st.t += s;
      // 甩头的力度攒起来，攒够就甩掉一圈
      const spin = Math.abs(A.tiltVel), speed = Math.abs(A.vel.x);
      M.energy = Math.max(0, M.energy - 0.6 * s) + (spin > 1.1 ? (spin - 1.1) * 1.6 * s : 0) + (speed > 450 ? ((speed - 450) / 450) * 1.4 * s : 0);
      if (M.energy > 1 && M.strips.length) { M.energy -= 1; unwrap(false); }
      if (M.strips.length < SLOTS.length) M.full = false;
      for (let i = M.loose.length - 1; i >= 0; i--) {
        const q = M.loose[i];
        q.age += s; q.vy += 700 * s; q.vx *= Math.exp(-0.8 * s); q.vy *= Math.exp(-0.8 * s);
        q.x += q.vx * s; q.y += q.vy * s; q.rot += q.vr * s + Math.sin(q.age * 9) * 0.6 * s;
        if (q.age > 1.8) M.loose.splice(i, 1);
      }
    },
    draw(g) {
      const A = HW.avatar, bands = HW.art.bandages;
      if (M.strips.length) {
        A.withFrame(g, g => {
          for (const st of M.strips) {
            const [x, y, ang, len, th] = SLOTS[st.slot];
            const k = seg(st.t, 0, WRAP_T), img = bands[st.variant];
            g.save();
            g.translate(x, y);
            g.rotate(ang);
            // 从一头往另一头缠上来
            g.beginPath();
            if (st.dir > 0) g.rect(-len / 2, -th, len * k, th * 2); else g.rect(len / 2 - len * k, -th, len * k, th * 2);
            g.clip();
            g.drawImage(img, -len / 2, -th / 2, len, th);
            g.restore();
          }
        });
      }
      for (const q of M.loose) {
        g.save();
        g.globalAlpha = 1 - seg(q.age, 1.2, 1.8);
        g.translate(q.x, q.y);
        g.rotate(q.rot);
        g.drawImage(bands[q.variant], -q.len / 2, -q.th / 2, q.len, q.th);
        g.restore();
      }
      if (M.strips.length >= 3) label(g, '绷带 ' + M.strips.length + '/' + SLOTS.length, 40, HW.H - 110, { size: 30, fill: '#F3E7CF' });
    },
  });

  function unwrap(gentle) {
    const A = HW.avatar, st = M.strips.pop(), [x, y, ang, len, th] = SLOTS[st.slot];
    const p = A.toStage(x, y), sc = A.scale(), side = Math.sign(A.vel.x || range(-1, 1));
    M.loose.push({ x: p.x, y: p.y, rot: ang + A.angle(), len: len * sc, th: th * sc, variant: st.variant, age: 0,
      vx: gentle ? range(-300, 300) : side * range(500, 900) + A.vel.x * 0.4, vy: gentle ? range(-500, -250) : range(-450, -150), vr: range(-5, 5) });

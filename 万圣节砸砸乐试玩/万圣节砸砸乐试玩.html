})();

/* fx-bats.js */
/* F · 蝙蝠倒挂：蝙蝠飞来倒挂在屏幕上沿的绳子上，或者挂在耳朵、头发上（跟着头晃），越挂越多；
   大礼物「吓一跳」全部惊飞。主播猛甩头，挂在头上的会被甩到绳子上去。 */
(function () {
  'use strict';
  const HW = window.HW;
  const { TAU, range, rand, pick, lerp, label } = HW.util;
  const ROPE_Y = 26;
  const HEAD_SPOTS = [['earL', -6, 18], ['earR', 6, 18], ['hairL', -10, 26], ['hairR', 10, 26]];

  const B = (HW.bats = {
    list: [], rope: 0,
    reset() { B.list.length = 0; B.rope = 0; },
    add(n = 2) {
      for (let i = 0; i < n; i++) {
        const onHead = rand() < 0.45 && headFree().length;
        const target = onHead ? { type: 'head', spot: pick(headFree()) } : { type: 'rope', x: range(60, HW.W - 60) };
        const side = rand() < 0.5 ? -1 : 1;
        B.list.push({ state: 'in', x: side < 0 ? -60 : HW.W + 60, y: range(80, 420), vx: 0, vy: 0, flap: range(0, TAU), target, swing: 0, swingV: 0, seed: range(0, TAU), s: range(1.25, 1.55) });
      }
      HW.sfx.flap();
      return B.list.length;
    },
    scare() {
      if (!B.list.length) return;
      for (const b of B.list) { b.state = 'scared'; const a = range(-Math.PI * 0.95, -Math.PI * 0.05); b.vx = Math.cos(a) * range(600, 1000); b.vy = Math.sin(a) * range(500, 900); }
      HW.sfx.squeak(); HW.sfx.flap();
      HW.ui.toast('蝙蝠全被吓飞啦！');
    },
    clear() { B.scare(); },
    update(dt) {
      const s = dt / 1000, A = HW.avatar;
      const shaking = Math.abs(A.vel.x) > 900 || Math.abs(A.tiltVel) > 2.6;
      for (let i = B.list.length - 1; i >= 0; i--) {
        const b = B.list[i];
        if (b.state === 'scared') {
          b.flap += 22 * s; b.x += b.vx * s; b.y += b.vy * s; b.vy -= 200 * s;
          if (b.x < -150 || b.x > HW.W + 150 || b.y < -150) B.list.splice(i, 1);
          continue;
        }
        const t = targetOf(b);
        if (b.state === 'in') {
          b.flap += 18 * s;
          const dx = t.x - b.x, dy = t.y - b.y, d = Math.hypot(dx, dy), sp = Math.min(900, 140 + d * 3);
          b.vx = lerp(b.vx, (dx / (d || 1)) * sp, Math.min(1, s * 6));
          b.vy = lerp(b.vy, (dy / (d || 1)) * sp + Math.sin(b.flap * 0.5) * 60, Math.min(1, s * 6));
          b.x += b.vx * s; b.y += b.vy * s;
          if (d < 10) { b.state = 'hang'; b.swingV = b.vx * 0.004; HW.sfx.squeak(); }
        } else {
          // 倒挂：像小钟摆一样晃，挂在头上的跟着头的加速度晃得更厉害
          const push = b.target.type === 'head' ? -A.acc.x / 260 - A.angAcc * 0.25 : 0;
          b.swingV += (-26 * b.swing - 2.2 * b.swingV + push) * s;
          b.swing += b.swingV * s;
          b.x = t.x; b.y = t.y;
          if (b.target.type === 'head' && shaking) { b.state = 'in'; b.target = { type: 'rope', x: range(60, HW.W - 60) }; b.vx = A.vel.x * 0.8; b.vy = -400; HW.sfx.squeak(); }
          if (rand() < s * 0.25) b.twitch = 0.35;
        }
        if (b.twitch > 0) b.twitch -= s;
      }
      B.rope = lerp(B.rope, B.list.some(b => b.target.type === 'rope' && b.state !== 'scared') ? 1 : 0, Math.min(1, s * 3));
    },
    draw(g, t) {
      if (B.rope > 0.01) {
        g.save();
        g.globalAlpha = B.rope;
        g.strokeStyle = '#4A3B63';
        g.lineWidth = 5;
        g.beginPath();
        for (let x = 0; x <= HW.W; x += 40) g.lineTo(x, ROPE_Y - 8 + Math.sin(x * 0.011) * 7);
        g.stroke();
        g.restore();
      }
      const A = HW.avatar;
      for (const b of B.list) {
        if (b.state === 'hang') {
          const twitch = b.twitch > 0;
          const rot = b.swing + (b.target.type === 'head' ? A.angle() * 0.6 : 0) + Math.sin(t * 2 + b.seed) * 0.05;
          // 挂点在脚上：先移到挂点，再往下画
          g.save();
          g.translate(b.x, b.y);
          g.rotate(rot);
          HW.art.drawBat(g, 0, 30 * b.s, b.s, twitch ? t * 30 : 0, !twitch, twitch ? Math.PI : 0);
          g.restore();
        } else {
          HW.art.drawBat(g, b.x, b.y, b.s, b.flap, false, Math.max(-0.4, Math.min(0.4, b.vx / 2000)));
        }
      }
      const n = B.list.filter(b => b.state !== 'scared').length;
      if (n) label(g, '蝙蝠 ' + n + ' 只', HW.W - 40, 70, { size: 28, align: 'right', fill: '#E6DCFF' });
    },
  });

  function headFree() {
    const used = B.list.filter(b => b.target.type === 'head' && b.state !== 'scared').map(b => b.target.spot[0]);
    return HEAD_SPOTS.filter(s => !used.includes(s[0]));
  }
  function targetOf(b) {
    if (b.target.type === 'rope') return { x: b.target.x, y: ROPE_Y - 6 + Math.sin(b.target.x * 0.011) * 7 };
    const [name, dx, dy] = b.target.spot, p = HW.avatar.point(name);
    return { x: p.x + dx, y: p.y + dy };
  }
})();

/* fx-candy.js */
/* G · 不给糖就捣蛋：糖飞进嘴里（嚼嚼），再落进右下角的南瓜桶。
   桶装满 FULL 颗：所有捣蛋立刻解除，再给 SHIELD 秒保护罩，期间来的捣蛋全变成糖。 */
(function () {
  'use strict';
  const HW = window.HW;
  const { TAU, range, rand, pick, seg, ease, arcPoint, label } = HW.util;
  const FULL = 20, SHIELD = 15;
  const BUCKET = { x: 1450, y: 800, s: 0.9 };

  const Ca = (HW.candy = {
    queue: [], flying: [], toBucket: [], count: 0, shield: -1, fx: { chomp: 0 }, pending: 0,
    reset() { Ca.queue.length = 0; Ca.flying.length = 0; Ca.toBucket.length = 0; Ca.count = 0; Ca.shield = -1; Ca.fx.chomp = 0; },
    // n 颗糖排着队一颗颗飞
    add(name, n = 1, converted = false) {
      for (let i = 0; i < n; i++) Ca.queue.push({ name, delay: i * 0.14, converted });
      return Ca.count + Ca.flying.length + Ca.toBucket.length + Ca.queue.length;
    },
    shielded() { return Ca.shield >= 0; },
    update(dt) {
      const s = dt / 1000, A = HW.avatar, mouth = A.point('mouth');
      for (let i = Ca.queue.length - 1; i >= 0; i--) {
        const q = Ca.queue[i];
        q.delay -= s;
        if (q.delay <= 0) {
          Ca.queue.splice(i, 1);
          const side = rand() < 0.5 ? -1 : 1;
          Ca.flying.push({ t: 0, from: { x: side < 0 ? range(-60, 200) : range(HW.W - 200, HW.W + 60), y: HW.H + 40 }, img: pick(HW.art.candies), spin: range(-10, 10), converted: q.converted });
          HW.sfx.pop();
        }
      }
      for (let i = Ca.flying.length - 1; i >= 0; i--) {
        const c = Ca.flying[i];
        c.t += s / 0.55;
        if (c.t >= 1) {
          Ca.flying.splice(i, 1);
          Ca.fx.chomp = 1;
          HW.sfx.chomp();
          if (rand() < 0.35) HW.particles.text(mouth.x + 70, mouth.y - 20, '嚼嚼', 32, '#FFC2DA');
          Ca.toBucket.push({ t: 0, from: { x: mouth.x, y: mouth.y + 20 }, img: c.img, spin: c.spin });
        }
      }
      for (let i = Ca.toBucket.length - 1; i >= 0; i--) {
        const c = Ca.toBucket[i];
        c.t += s / 0.6;
        if (c.t >= 1) {
          Ca.toBucket.splice(i, 1);
          Ca.count++;
          HW.sfx.coin();
          HW.particles.sparks(BUCKET.x, BUCKET.y - 70, 4, '#FFE3A0');
          if (Ca.count >= FULL) full();
        }
      }
      Ca.fx.chomp = Math.max(0, Ca.fx.chomp - s * 5);
      if (Ca.shield >= 0) { Ca.shield += s; if (Ca.shield >= SHIELD) { Ca.shield = -1; HW.ui.toast('保护罩消失了，小心捣蛋！'); } }
    },
    drawBack(g, t) {
      // 保护罩的后半圈（在皮套后面）
      if (Ca.shield >= 0) drawShield(g, t, false);
    },
    draw(g, t) {
      const A = HW.avatar, mouth = A.point('mouth');
      for (const c of Ca.flying) {
        const p = arcPoint(c.from, mouth, ease.outCubic(c.t), 220);
        drawImg(g, c.img, p.x, p.y, 64 * (1 - 0.3 * c.t), c.t * c.spin);
      }
      const opening = { x: BUCKET.x, y: BUCKET.y - 70 };
      for (const c of Ca.toBucket) {
        const p = arcPoint(c.from, opening, c.t, 180);
        drawImg(g, c.img, p.x, p.y, 44, c.t * c.spin);
      }
      drawBucket(g);
      if (Ca.shield >= 0) drawShield(g, t, true);
    },
  });

  function full() {
    HW.sfx.jingle();
    HW.ui.toast('糖够啦！捣蛋全部解除');
    HW.particles.burstCandy(BUCKET.x, BUCKET.y - 80, 40, 1.3);
    Ca.count = 0;
    HW.main.clearTricks();
    Ca.shield = 0;
    setTimeout(() => HW.sfx.shield(), 300);
  }
  function drawImg(g, img, x, y, w, rot) {
    const h = w * (img.height / img.width);
    g.save(); g.translate(x, y); g.rotate(rot); g.drawImage(img, -w / 2, -h / 2, w, h); g.restore();
  }
  function drawBucket(g) {
    const { x, y, s } = BUCKET, back = HW.art.bucketBack, front = HW.art.bucketFront;
    const w = back.width * s, h = back.height * s, left = x - w / 2, top = y - h / 2;
    g.drawImage(back, left, top, w, h);
    // 桶里的糖：越多堆得越高
    const fill = Math.min(1, Ca.count / FULL);
    if (Ca.count > 0) {
      g.save();
      g.beginPath();
      g.ellipse(x, top + 66 * s, 84 * s, 22 * s + fill * 40 * s, 0, Math.PI, 0);
      g.rect(x - 84 * s, top + 66 * s, 168 * s, 40 * s);
      g.clip();
      const n = Math.min(24, 4 + Ca.count);
      for (let i = 0; i < n; i++) {
        const u = (i * 0.618) % 1, v = (i * 0.37) % 1;
        drawImg(g, HW.art.candies[i % 6], x + (u - 0.5) * 150 * s, top + (70 - fill * 34 - v * 22) * s, 40 * s, (u - 0.5) * 2);
      }
      g.restore();
    }
    g.drawImage(front, left, top, w, h);
    // 计数条（只写数字，不写别的）
    const bw = 170, bx = x - bw / 2, by = top - 26;
    g.fillStyle = 'rgba(30,20,48,.75)';
    g.beginPath(); g.roundRect(bx, by, bw, 18, 9); g.fill();
    g.fillStyle = '#FF8FB8';
    g.beginPath(); g.roundRect(bx + 2, by + 2, Math.max(0, (bw - 4) * fill), 14, 7); g.fill();
    label(g, Ca.count + ' / ' + FULL, x, by - 20, { size: 26, align: 'center', fill: '#FFE3EE' });
  }
  function drawShield(g, t, front) {
    const A = HW.avatar, c = A.point('face'), r = 300, cy = c.y + 90;
    const left = 1 - Ca.shield / SHIELD, appear = ease.outBack(seg(Ca.shield, 0, 0.5)), fade = Ca.shield > SHIELD - 1 ? 0.5 + 0.5 * Math.sin(t * 20) : 1;
    g.save();
    g.globalAlpha = 0.85 * fade;
    g.translate(c.x, cy);
    g.scale(appear, appear);
    g.lineWidth = 6;
    const grd = g.createLinearGradient(-r, -r, r, r);
    grd.addColorStop(0, 'rgba(255,170,210,.95)'); grd.addColorStop(0.5, 'rgba(160,240,215,.95)'); grd.addColorStop(1, 'rgba(255,220,130,.95)');
    g.strokeStyle = grd;
    g.beginPath();
    if (front) g.arc(0, 0, r, 0.05 * Math.PI, 0.95 * Math.PI); else g.arc(0, 0, r, Math.PI, TAU);
    g.stroke();
    if (front) {
      g.fillStyle = 'rgba(200,240,255,.08)';
      g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill();
      // 剩余时间：顶上一段圆弧
      g.lineWidth = 10; g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineCap = 'round';
      g.beginPath(); g.arc(0, 0, r + 22, -Math.PI / 2 - left * Math.PI * 0.45, -Math.PI / 2 + left * Math.PI * 0.45); g.stroke();
      for (let i = 0; i < 6; i++) {
        const a = t * 0.8 + (i * TAU) / 6;
        g.fillStyle = 'rgba(255,255,255,.9)';
        g.beginPath(); g.arc(Math.cos(a) * r, Math.sin(a) * r, 5, 0, TAU); g.fill();
      }
    }
    g.restore();
  }
})();

/* main.js */
/* 万圣节砸砸乐试玩 · 主循环、按钮、提示字
   质检用：window.hw.advance(毫秒) 不靠浏览器动画帧也能往前走（预览窗口藏起来时用）。 */
(function () {
  'use strict';
  const HW = window.HW;
  const { pick, label, reseed } = HW.util;
  const canvas = document.getElementById('stage'), g = canvas.getContext('2d');
  const STEP = 1000 / 60;
  let view = 1, last = 0, sim = 0, raf = 0, bg = null;
  const toasts = [], scheduled = [];

  HW.ui = { toast(text) { toasts.unshift({ text, age: 0 }); if (toasts.length > 4) toasts.length = 4; } };

  // 七种互动：捣蛋六种 + 糖果保护
  const TRICKS = {
    tower: { name: '南瓜叠叠乐', run: who => { const n = HW.tower.add(); HW.ui.toast(who + ' 往你头上叠了个南瓜（第 ' + n + ' 层）'); } },
    flood: { name: '南瓜淹没', run: who => { HW.flood.add(6); HW.ui.toast(who + ' 下了一阵南瓜雨'); } },
    ghost: { name: '小幽灵', run: who => { HW.ghosts.add(); HW.ui.toast(who + ' 放出一只小幽灵'); } },
    potion: { name: '变身药水', run: who => { HW.potion.add(who); } },
    mummy: { name: '木乃伊', run: who => { HW.mummy.add(); HW.ui.toast(who + ' 给你缠了一圈绷带'); } },
    bats: { name: '蝙蝠倒挂', run: who => { HW.bats.add(2); HW.ui.toast(who + ' 引来两只蝙蝠'); } },
  };
  const pool = new Set(Object.keys(TRICKS));

  function trick(kind) {
    const who = pick(HW.names);
    if (HW.candy.shielded()) { HW.candy.add(who, 1, true); HW.ui.toast(who + ' 的捣蛋被保护罩变成了糖'); return; }
    const list = [...pool];
    const k = kind === 'random' ? (list.length ? pick(list) : null) : kind;
    if (k) TRICKS[k].run(who);
  }
  function candy(n) { const who = pick(HW.names); HW.candy.add(who, n); HW.ui.toast(who + ' 喂了你 ' + n + ' 颗糖'); }
  function clearTricks() { HW.tower.clear(true); HW.flood.clear(); HW.ghosts.clear(); HW.potion.clear(); HW.mummy.clear(); HW.bats.clear(); }
  function resetAll() {
    reseed(20261031);
    HW.tower.reset(); HW.flood.reset(); HW.ghosts.reset(); HW.potion.reset(); HW.mummy.reset(); HW.bats.reset(); HW.candy.reset();
    HW.particles.clear(); HW.avatar.reset(); toasts.length = 0; scheduled.length = 0;
  }
  // 「连送 5 次」：按模拟时间排队，不用定时器
  function repeat(times, fn) { for (let i = 0; i < times; i++) scheduled.push({ at: sim + i * 0.28, fn }); }
  HW.main = { clearTricks, trick, candy, resetAll, TRICKS, pool };

  function step(dt) {
    sim += dt / 1000;
    for (let i = scheduled.length - 1; i >= 0; i--) if (scheduled[i].at <= sim) { const job = scheduled[i]; scheduled.splice(i, 1); job.fn(); }
    HW.potion.update(dt); HW.ghosts.update(dt); HW.candy.update(dt);
    // 各效果对皮套的影响合在一起（真插件里分别发给 VTS）
    const f = HW.avatar.fx, P = HW.potion.fx, Gf = HW.ghosts.fx;
    f.scale = P.scale; f.scaleAnchor = HW.avatar.POINTS[P.anchor === 'face' ? 'face' : 'bottom']; f.flip = P.flip; f.green = P.green;
    f.alpha = P.alpha * Gf.alpha; f.ghost = Gf.ghost; f.lift = Gf.lift; f.sway = Gf.sway; f.chomp = HW.candy.fx.chomp;
    HW.avatar.update(dt);
    HW.tower.update(dt); HW.flood.update(dt); HW.mummy.update(dt); HW.bats.update(dt); HW.particles.update(dt);
    for (let i = toasts.length - 1; i >= 0; i--) { toasts[i].age += dt / 1000; if (toasts[i].age > 3.4) toasts.splice(i, 1); }
  }
  function background() {
    const c = document.createElement('canvas');
    c.width = HW.W; c.height = HW.H;
    const b = c.getContext('2d');
    const gr = b.createLinearGradient(0, 0, 0, HW.H);
    gr.addColorStop(0, '#2C2240'); gr.addColorStop(1, '#17121F');
    b.fillStyle = gr; b.fillRect(0, 0, HW.W, HW.H);
    const v = b.createRadialGradient(HW.W / 2, HW.H * 0.45, 200, HW.W / 2, HW.H * 0.5, 980);
    v.addColorStop(0, 'rgba(120,90,170,.18)'); v.addColorStop(1, 'rgba(0,0,0,.35)');
    b.fillStyle = v; b.fillRect(0, 0, HW.W, HW.H);
    return c;
  }
  function render() {
    const t = sim;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, canvas.width, canvas.height);
    g.setTransform(view, 0, 0, view, 0, 0);
    g.drawImage(bg, 0, 0);
    HW.candy.drawBack(g, t);
    HW.ghosts.draw(g, false);
    HW.avatar.draw(g);
    HW.flood.draw(g);
    HW.mummy.draw(g);
    HW.tower.draw(g, t);
    HW.bats.draw(g, t);
    HW.ghosts.draw(g, true);
    HW.potion.draw(g);
    HW.particles.draw(g);
    HW.candy.draw(g, t);
    toasts.forEach((m, i) => label(g, m.text, 40, 56 + i * 50, { size: 32, alpha: Math.min(1, (3.4 - m.age) / 0.6) * Math.min(1, m.age / 0.15) }));
    if (HW.tower.record >= 2) label(g, '南瓜塔最高 ' + HW.tower.record + ' 层', HW.W - 40, 166, { size: 28, align: 'right', fill: '#FFD45C' });
  }
  function tick(now) {
    const dt = last ? Math.min(50, now - last) : STEP;
    last = now;
    step(dt);
    render();
    raf = requestAnimationFrame(tick);
  }
  function resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1), r = canvas.getBoundingClientRect();
    const w = Math.max(320, Math.round(r.width * dpr));
    if (canvas.width !== w) { canvas.width = w; canvas.height = Math.round((w * HW.H) / HW.W); }
    view = canvas.width / HW.W;
  }
  function stagePoint(e) { const r = canvas.getBoundingClientRect(); return { x: ((e.clientX - r.left) / r.width) * HW.W, y: ((e.clientY - r.top) / r.height) * HW.H }; }

  function setupControls() {
    const combo = document.getElementById('combo');
    const times = () => (combo.checked ? 5 : 1);
    document.querySelectorAll('[data-trick]').forEach(b => {
      b.onclick = () => { HW.sfx.unlock(); repeat(times(), () => trick(b.dataset.trick)); };
    });
    document.getElementById('candy1').onclick = () => { HW.sfx.unlock(); candy(1); };
    document.getElementById('candy5').onclick = () => { HW.sfx.unlock(); candy(5); };
    document.getElementById('scare').onclick = () => { HW.sfx.unlock(); HW.bats.scare(); };
    document.getElementById('shake').onclick = () => { HW.sfx.unlock(); HW.avatar.shake(); };
    document.getElementById('reset').onclick = () => resetAll();
    document.getElementById('auto').onchange = e => { HW.avatar.auto = e.target.checked; };
    document.getElementById('mute').onchange = e => HW.sfx.setMuted(e.target.checked);
    const chips = document.getElementById('pool');
    for (const [key, t] of Object.entries(TRICKS)) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.textContent = t.name; b.setAttribute('aria-pressed', 'true');
      b.onclick = () => { if (pool.has(key)) pool.delete(key); else pool.add(key); b.setAttribute('aria-pressed', String(pool.has(key))); };
      chips.append(b);
    }
    canvas.addEventListener('pointerdown', e => { HW.sfx.unlock(); canvas.setPointerCapture(e.pointerId); const p = stagePoint(e); HW.avatar.dragStart(p.x, p.y); });
    canvas.addEventListener('pointermove', e => { if (HW.avatar.drag) { const p = stagePoint(e); HW.avatar.dragMove(p.x, p.y); } });
    for (const ev of ['pointerup', 'pointercancel']) canvas.addEventListener(ev, () => HW.avatar.dragEnd());
    window.addEventListener('resize', resize);
  }

  function start() {
    HW.art.init();
    HW.flood.init();
    bg = background();
    const img = new Image();
    img.onload = () => {
      HW.avatar.init(img);
      resetAll();
      setupControls();
      resize();
      window.hw = {
        ready: true,
        advance(ms) { cancelAnimationFrame(raf); resize(); for (let t = 0; t < ms; t += STEP) step(STEP); render(); return sim; },
        resume() { last = 0; raf = requestAnimationFrame(tick); },
        trick, candy, resetAll, shake: () => HW.avatar.shake(),
        drag(dx, dy) { HW.avatar.dragStart(800, 450); HW.avatar.dragMove(800 + dx, 450 + dy); },
        release() { HW.avatar.dragEnd(); },
        state: () => ({ tower: HW.tower.count(), record: HW.tower.record, flood: HW.flood.count, overflow: HW.flood.overflow, ghosts: HW.ghosts.list.length, possess: HW.ghosts.possess,
          potion: HW.potion.cur && HW.potion.cur.key, mummy: HW.mummy.strips.length, bats: HW.bats.list.length, candy: HW.candy.count, shield: HW.candy.shield }),
      };
      raf = requestAnimationFrame(tick);
    };
    img.onerror = () => { window.hw = { ready: false, error: '皮套图片没加载出来' }; };
    img.src = document.getElementById('avatar-src').textContent.trim();
  }
  start();
})();

</script>
</body>
</html>

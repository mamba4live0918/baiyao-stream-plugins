<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>落叶寻针 · 试玩</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:"Microsoft YaHei UI",sans-serif}#preview-background{position:fixed;inset:0;background:#66616c}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}.preview-tools{position:fixed;top:30px;left:50%;transform:translateX(-50%);border:1px solid #bca17b26;background:#fff2d9ed;color:#79543b;border-radius:30px;padding:8px 13px;display:flex;align-items:center;gap:11px;font-size:10px;z-index:2;box-shadow:0 5px 15px #0001}.preview-tools select{font:inherit;color:#79543b;background:transparent;border:0;outline-offset:5px;max-width:100px}.preview-tools option{background:#66616c}.preview-tools button{font:inherit;color:#79543b;background:none;border:0;cursor:pointer}.preview-tools .sep{height:12px;width:1px;background:#baa58040}@media(max-width:1100px){.preview-tools{top:auto;bottom:148px;left:auto;right:23px;transform:none}}@media(max-width:680px){.preview-tools{top:30px;bottom:auto;right:14px;max-width:150px;flex-wrap:wrap;justify-content:center;gap:5px;padding:8px 9px;border-radius:13px}.preview-tools>span:first-child{width:100%;text-align:center}.preview-tools .sep{display:none}}</style></head><body><div id="preview-background"></div><iframe src="../落叶寻针-v0.11-自然避让完整版.html" title="透明落叶寻针插件" allow="autoplay"></iframe><div class="preview-tools"><span>仅预览背景</span><select id="background" aria-label="切换预览背景"><option value="dark">暖雾紫</option><option value="light">暖砂白</option><option value="checker">透明棋盘</option><option value="green">直播绿幕</option></select><span class="sep"></span><button id="hide" title="隐藏预览工具，刷新后恢复">隐藏</button></div><script>const bg=document.getElementById('preview-background');document.getElementById('background').onchange=e=>{const styles={dark:'#66616c',light:'#f4e9d8',green:'#206844',checker:'repeating-conic-gradient(#41433f 0% 25%,#343632 0% 50%) 0 / 30px 30px'};bg.style.background=styles[e.target.value];};document.getElementById('hide').onclick=()=>document.querySelector('.preview-tools').hidden=true;</script></body></html>

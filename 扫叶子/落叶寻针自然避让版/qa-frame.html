<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>完整画面验收</title><style>body{margin:0;background:#66616c;color:white;font:12px sans-serif}nav{height:55px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#302b31}iframe{position:absolute;top:55px;width:100%;height:calc(100% - 55px);border:0}button{padding:8px}#status{white-space:pre-wrap}</style><nav><button id="audit">验证完整画面</button><button id="pixels">验证实际透明</button><span id="status">加载中</span></nav><iframe src="../落叶寻针-v0.11-自然避让完整版.html" title="完整插件"></iframe><script>
const f=document.querySelector('iframe'),out=document.getElementById('status');let api;f.onload=function wait(){api=f.contentWindow.AutumnNeedle;if(!api?.getState().ready)return requestAnimationFrame(wait);out.textContent='实际插件就绪';};
document.getElementById('audit').onclick=()=>{const w=api.world;w.setHead({enabled:false,x:.5,y:.4,r:140});w.reset(30000,7200,72);const cover=w.coverageAt(w.needle).min;let clipped=0;for(const l of w.leaves){const e=l.size*Math.SQRT1_2;if(l.x-e<0||l.x+e>w.w||l.y-e<0||l.y+e>w.h)clipped++;}const count=w.leaves.length;w.setHead({enabled:true,x:.5,y:.4,r:140});let inside=0;for(const l of w.leaves)if(Math.hypot(l.x-w.head.x*w.w,l.y-w.head.y*w.h)<w.head.r*w.unit+l.size*Math.SQRT1_2)inside++;const box=f.contentDocument.getElementById('overlay').getBoundingClientRect(),v=f.contentWindow;const fits=box.left>=-.1&&box.top>=-.1&&box.right<=v.innerWidth+.1&&box.bottom<=v.innerHeight+.1;out.textContent='真实素材遮挡 '+cover+' 层；截边 '+clipped+'；穿圈 '+inside+'；叶量 '+count+'→'+w.leaves.length+'；整页适配 '+fits;};
document.getElementById('pixels').onclick=()=>requestAnimationFrame(()=>requestAnimationFrame(()=>{const w=api.world,c=f.contentDocument.getElementById('scene'),r=c.width/w.w,d=c.getContext('2d').getImageData(0,0,c.width,c.height).data,cx=w.head.x*w.w,cy=w.head.y*w.h,rad=w.head.r*w.unit-3;let opaque=0,total=0,edge=0;for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++){const a=d[(y*c.width+x)*4+3];if((x===0||y===0||x===c.width-1||y===c.height-1)&&a)edge++;if(Math.hypot(x/r-cx,y/r-cy)<rad){total++;if(a)opaque++;}}out.textContent='圈内 '+total+' 像素：不透明 '+opaque+'；画布四边不透明像素 '+edge;}));
</script></html>

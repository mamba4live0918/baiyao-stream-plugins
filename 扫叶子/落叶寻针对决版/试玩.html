<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>落叶寻针 · 2.5D 小样试玩</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:"Microsoft YaHei UI",sans-serif}#preview-background{position:fixed;inset:0;background:#66616c}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}.preview-tools{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;padding:8px 14px;border-radius:30px;background:#fff2d9ed;color:#79543b;font-size:12px;z-index:2;box-shadow:0 5px 15px #0001}.preview-tools button{font:inherit;color:#79543b;background:#fff8ea;border:1px solid #d9bd93;border-radius:999px;padding:3px 10px;cursor:pointer}.preview-tools button[aria-pressed="true"]{background:#f3d7a6}</style></head>

<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>抓萌宠 · 操作页</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#674735;user-select:none;touch-action:none}button,input,select{font:inherit}button{cursor:pointer;border:0}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ef795f;outline-offset:4px}button:disabled{opacity:.5;cursor:wait}button:hover{filter:brightness(1.035)}
#ambient{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% 35%,#fffcf4,#f1e8d3 80%);display:none}body[data-bg=cream] #ambient{display:block}body[data-bg=green]{background:#00ff00}body[data-bg=checker]{background-color:#ede9e3;background-image:linear-gradient(45deg,#dedad4 25%,transparent 25%),linear-gradient(-45deg,#dedad4 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#dedad4 75%),linear-gradient(-45deg,transparent 75%,#dedad4 75%);background-size:40px 40px;background-position:0 0,0 20px,20px -20px,-20px 0}
#top{position:absolute;left:3.2%;right:3.2%;top:3.6%;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:30}.brand{filter:drop-shadow(0 2px 0 #fff9);line-height:1.1}.brand strong{font-size:clamp(26px,4vw,52px);font-weight:950;letter-spacing:2px;-webkit-text-stroke:1px #fff3}.brand small{display:block;font-size:clamp(12px,1.45vw,20px);margin-top:12px;letter-spacing:3px}.top-actions{display:flex;gap:12px;align-items:center;pointer-events:auto}.counts{display:flex;gap:24px;align-items:center;border:1px solid #fff9;background:#fff8ecef;box-shadow:0 6px 16px #48210e12;border-radius:30px;padding:12px 22px;font-size:15px}.counts span+span{border-left:1px solid #d6c6b8;padding-left:24px}.counts b{font-size:29px;color:#e47962;padding-left:8px}.gear{width:46px;height:46px;display:grid;place-items:center;border-radius:50%;background:#fff8ecf5;color:#745749;box-shadow:0 4px 12px #48210e12}.gear svg{width:23px;height:23px}
#show{position:absolute;width:440px;max-width:58vw;left:50%;top:15%;transform:translateX(-50%);text-align:center;pointer-events:none;z-index:5}.call{font-size:clamp(30px,4.8vw,66px);font-weight:950;letter-spacing:1px;white-space:nowrap;color:#ef826a;line-height:1.2;paint-order:stroke fill;-webkit-text-stroke:5px #fff9e9;filter:drop-shadow(0 5px 1px #67473528)}.call.pop{animation:pop .32s ease-out}.sub{margin:15px 0 4px;font-weight:700;font-size:clamp(13px,1.6vw,21px);text-shadow:0 1px 5px #fff,0 0 8px #fff}.mascots{height:clamp(140px,24vh,260px);display:flex;align-items:center;justify-content:center;margin-top:20px;gap:0}.mascots img{height:100%;width:53%;object-fit:contain;filter:drop-shadow(0 12px 6px #633d2520);animation:bob 3.2s ease-in-out infinite;transform-origin:50% 92%}.mascots img+img{animation-delay:-1.6s;margin-left:-12px}.playing .mascots img{animation:bounce .68s ease-in-out infinite}.playing .mascots img+img{animation-delay:-.34s}.mascots.sleep img{opacity:.78}
#field{position:absolute;inset:0;overflow:hidden}.calf{position:absolute;left:0;top:0;background:transparent;padding:0;touch-action:none;cursor:grab;will-change:transform;border-radius:50%;transform-origin:50% 85%;z-index:10}.calf img{width:100%;height:100%;object-fit:contain;pointer-events:none;filter:drop-shadow(0 6px 4px #70462930)}.calf.held{cursor:grabbing;z-index:40;filter:drop-shadow(0 0 6px #ffc762)}.calf.returning{pointer-events:none;transition:transform .42s ease-in,opacity .4s ease;opacity:0}
#pen{position:absolute;width:clamp(170px,27vw,390px);right:3%;bottom:13%;z-index:20;pointer-events:none;transition:filter .15s,transform .15s}#pen img{display:block;width:100%;filter:drop-shadow(0 15px 9px #66472d20)}#pen .pen-name{position:absolute;left:28%;top:12.2%;width:44%;text-align:center;font-weight:900;font-size:clamp(14px,2vw,27px);letter-spacing:3px;color:#79503b;transform:rotate(-1deg)}#pen .pen-hint{position:absolute;left:16%;right:16%;bottom:3%;text-align:center;background:#fff5dfed;padding:8px;border:1px solid #d8bea2;border-radius:22px;font-weight:700;font-size:clamp(10px,1vw,14px)}#pen.over{filter:drop-shadow(0 0 15px #ffd880);transform:scale(1.025)}#pen.pulse{animation:pop .35s ease-out}
#toolbar{position:absolute;z-index:50;left:50%;bottom:3.8%;transform:translateX(-50%);background:#fff9edee;border:1px solid #fff;box-shadow:0 8px 30px #6b442418;border-radius:40px;padding:12px;display:flex;gap:12px;align-items:center;white-space:nowrap}#toolbar button{padding:14px 24px;border-radius:30px;font-weight:750;font-size:17px;transition:transform .15s}#toolbar button:active{transform:scale(.96)}.primary{background:linear-gradient(#fb947e,#eb725c);color:#fff;box-shadow:inset 0 2px 0 #ffb29d,0 3px 0 #d4614c}.secondary{color:#846958;background:transparent;border:1px solid #dfd2bf!important}#toolbar .tip{font-size:14px;color:#a18a77;padding:0 18px;border-left:1px solid #d6c9b6}.hidden-controls #toolbar{display:none}.hidden-controls .brand small{display:none}#status{position:absolute;left:3.5%;bottom:16%;z-index:25;font-size:13px;background:#fff9eaeb;border:1px solid #e7d8bf;border-radius:18px;padding:7px 12px;max-width:55%;display:none}#status:not(:empty){display:block}
#toast{position:absolute;left:50%;top:10%;transform:translateX(-50%);z-index:110;border-radius:16px;padding:10px 20px;background:#5b443cf0;color:#fff;font-size:14px;opacity:0;transition:opacity .15s;pointer-events:none;max-width:90%;text-align:center}#toast.on{opacity:1}#storage-alert{position:absolute;bottom:0;left:0;right:0;background:#8e493de8;color:white;font-size:13px;text-align:center;padding:6px;z-index:120;display:none}.spark{position:absolute;z-index:45;pointer-events:none;color:#ffc765;font-size:23px;animation:spark .65s ease-out forwards}
#shade{position:fixed;inset:0;z-index:90;background:transparent;display:none}#shade.open{display:block}#settings{position:absolute;right:24px;top:24px;bottom:24px;width:min(410px,calc(100vw - 32px));overflow-y:auto;padding:24px;background:#fffaf1;border-radius:26px;box-shadow:0 15px 70px #3f261a30;touch-action:pan-y;user-select:text}#settings h2{font-size:23px;margin:0 0 20px}#settings h3{font-size:15px;color:#936b51;border-top:1px solid #e9dccb;padding-top:20px;margin-top:23px}#settings label{font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin:15px 0}#settings select,#settings input{padding:8px 10px;min-width:0;border:1px solid #ddcbb7;background:#fff;border-radius:9px;color:#644b3b;max-width:180px}#settings input[type=number]{width:90px}#settings input[type=checkbox]{accent-color:#e47f65;width:18px;height:18px}#settings p{font-size:12px;line-height:1.7;color:#977f6b}#settings .row{display:flex;gap:10px;margin:10px 0}#settings button{font-size:13px;border-radius:10px;padding:10px 15px;background:#eddfca;color:#6b4b36}#settings .row button{flex:1}#settings .close{float:right;background:transparent;font-size:22px;padding:0 8px}#settings .danger{background:#f4dfd8;color:#a05441}#settings .feedback{min-height:22px;font-size:12px;color:#9e4f3b}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}@keyframes bounce{0%,100%{transform:translateY(0) rotate(-4deg)}45%{transform:translateY(-22px) rotate(5deg)}}@keyframes pop{0%{scale:.85}55%{scale:1.08}100%{scale:1}}@keyframes spark{to{transform:translate(var(--dx),-75px) rotate(60deg);opacity:0}}body[data-motion=off] *{animation:none!important;transition:none!important}@media(prefers-reduced-motion:reduce){body[data-motion=system] *{animation:none!important;transition:none!important}}
@media(max-width:650px){#top{top:22px}.counts{padding:8px 12px;gap:12px;font-size:11px}.counts span+span{padding-left:12px}.counts b{font-size:20px}.top-actions{gap:6px}.gear{width:34px;height:34px}.brand strong{font-size:25px}.brand small{font-size:10px;letter-spacing:0;margin-top:7px}#show{top:19%;max-width:82vw}.mascots{height:190px}#pen{right:0;bottom:18%;width:37vw;min-width:140px}#toolbar{bottom:4%;padding:9px;gap:8px;max-width:96vw}#toolbar button{font-size:14px;padding:12px 18px}#toolbar .tip{display:none}#status{bottom:14%;font-size:11px;max-width:90%}#settings{right:16px;top:16px;bottom:16px}}
</style></head><body data-bg="transparent" data-motion="system">
<div id="ambient"></div><header id="top"><button class="gear" id="settings-btn" aria-label="设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 3-1 3-3 1-2 4 2 2v3l4 3 3-1 3 1 4-3v-3l2-2-2-4-3-1-1-3z"/><circle cx="12" cy="11" r="3"/></svg></button></header><!--__HUD__-->
<main id="field" aria-label="萌宠活动区"></main><section id="show" aria-live="polite"><div class="box-visual"><img id="box-art" alt="萌宠盲盒" draggable="false"><div class="box-pet"><img id="mascot-a" alt="萌宠形象" draggable="false"><img id="mascot-b" alt="" draggable="false" hidden></div></div><div class="call" id="call">萌宠盲盒</div><div class="sub" id="subtitle"></div></section>
<div id="pen"><img id="pen-img" alt="铺着软垫的萌宠窝" draggable="false"><div class="pen-name">萌宠窝</div><div class="pen-hint" id="pen-hint">拖到小窝图片 · 松手回家</div></div>
<div id="toolbar" hidden aria-hidden="true"><button id="open-add-menu" class="secondary">手动加萌宠</button><button id="start" class="primary">开盲盒</button><button id="auto" class="secondary" aria-pressed="false">连续开盒</button><div class="tip">按住萌宠，拖进右侧萌宠窝</div><button id="toolbar-hide" type="button" aria-label="隐藏底部操作栏">×</button></div><div id="toast" role="status"></div><div id="storage-alert" role="alert"></div>
<div id="shade"><aside id="settings" role="dialog" aria-modal="true" aria-labelledby="settings-title"><button id="close" class="close" aria-label="关闭设置">×</button><h2 id="settings-title">萌宠乐园设置</h2>
<label>画面背景<select id="bg"><option value="transparent">透明底 · 直播叠加</option><option value="cream">奶油底 · 本地试玩</option><option value="checker">棋盘格 · 检查透明</option><option value="green">绿幕 · 备用抠像</option></select></label>
<label>报数配音<input type="checkbox" id="voice"></label><label>轻柔音效<input type="checkbox" id="sound"></label><label>装饰动画<select id="motion"><option value="system">跟随系统</option><option value="on">开启</option><option value="off">关闭</option></select></label><label>显示底部操作栏<input type="checkbox" id="controls"></label>
<h3>随机素材</h3><p>沿用参考视频的 10 档：1、2、5、11、15、20、40、50、80、100。每档等概率；奶油豹、焦糖豹随机出现。</p><label>没抓到的概率<input id="miss" type="number" min="0" max="100" step="1">%</label><p>默认 0%：报多少只，就掉多少只。设为 50% 可加入参考视频那样的“没抓到”空轮，空轮不掉萌宠。</p><label>连续播放间隔<input id="interval" type="number" min="1" max="120" step="1">秒</label><label>萌宠大小<input id="size" type="number" min="45" max="150" step="1">像素</label><label>一把可抓几只<input id="grip" type="number" min="1" max="30" step="1">只</label><div class="feedback" id="form-error"></div>
<h3>礼物接入</h3><label>触发随机一轮<input id="gift" type="text" maxlength="40" placeholder="填写礼物名称"></label><p>每个礼物排一轮，按到达顺序播放。菘蓝 SDK 优先；本地转发需手动开启。未配置的礼物不触发。</p><label>连接本地礼物转发<input id="connect" type="checkbox"></label><p id="connection">独立使用中</p><button id="test-gift">模拟收到 1 个触发礼物</button>
<h3>手动试玩</h3><label>测试掉落数量<input id="test-count" type="number" min="1" max="100" value="5">只</label><div class="row"><button id="drop-test">掉落萌宠</button><button id="collect-test">收回 1 只</button></div><div class="row"><button id="reset" class="danger">清空本场</button></div><p>画面素材、配音和音效已内置。透明动画文件仅播放，不产生互动；直播抓取请使用本 HTML。</p></aside></div>
<script>/*__ASSETS__*/</script><script>/*__CORE__*/</script><script>/*__APP__*/</script></body></html>
